name: AI iterate parallel Tool ordering spike

on:
  push:
    branches:
      - spike/m0-pi-parallel-tool-ordering

permissions:
  contents: write

concurrency:
  group: ai-iterate-parallel-tool-ordering
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout iteration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: spike/m0-pi-parallel-tool-ordering
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed Runtime repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/probes/pi-parallel-tool-ordering-capture.mjs")
          source = path.read_text(encoding="utf-8")
          old = "const pendingMessageCountBeforeShutdown = session.getPendingMessageCount();"
          new = "const pendingMessageCountBeforeShutdown = session.pendingMessageCount;"
          if new not in source:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one Runtime repair target, found {count}")
              source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8")
          PY
          node --check scripts/probes/pi-parallel-tool-ordering-capture.mjs
          git diff --check

      - name: Commit Runtime repair
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/probes/pi-parallel-tool-ordering-capture.mjs
          if git diff --cached --quiet; then
            echo "Runtime repair is already applied."
            exit 0
          fi
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git commit -m "fix(spike): read Pi pending message count property"
          git push origin HEAD:spike/m0-pi-parallel-tool-ordering
