name: PR 66 normalized RPC provenance repair v2

on:
  push:
    branches: [feat/49-normalized-runtime-event-v1]
    paths:
      - .github/workflows/pr66-rpc-provenance-fix-v2.yml

permissions:
  contents: write

concurrency:
  group: pr66-normalized-rpc-provenance-repair-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/49-normalized-runtime-event-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Verify trigger identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup exact Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1

      - name: Apply normalized Artifact validation repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          provenance = Path("packages/pi-adapter/fixtures/pi-lifecycle-sdk-rpc-parity/rpc-worker-lifecycle-provenance.mjs")
          text = provenance.read_text(encoding="utf-8")
          import_line = 'import { normalizeRpcWorkerResult } from "./rpc-worker-lifecycle-normalizer.mjs";\n'
          if text.count(import_line) != 1:
              raise SystemExit("normalizer import identity drifted")
          text = text.replace(import_line, "", 1)
          start_marker = "  const sourceNormalized = normalizeRpcWorkerResult("
          end_marker = "  return {\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Artifact comparison block identity drifted")
          replacement = '''  const sourceResult = parseResultJson(
            sourceResultBytes,
            "RPC Worker source result.json",
          );
          const comparisonResult = parseResultJson(
            comparisonResultBytes,
            "RPC Worker comparison result.json",
          );
          requireValue(
            isDeepStrictEqual(sourceResult, comparisonResult),
            "RPC Worker source attempts contain different complete normalized objects.",
          );
          requireValue(
            isDeepStrictEqual(sourceResult, committedResult),
            "RPC Worker public source Artifact does not equal the complete committed v2 Fixture.",
          );
          '''
          provenance.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          test_path = Path("packages/pi-adapter/fixtures/pi-lifecycle-sdk-rpc-parity/rpc-worker-lifecycle-provenance.test.mjs")
          test = test_path.read_text(encoding="utf-8")
          import_end_marker = '} from "./rpc-worker-lifecycle-provenance.mjs";\n'
          import_end = test.find(import_end_marker)
          if not test.startswith("import {\n") or import_end < 0:
              raise SystemExit("provenance test import identity drifted")
          import_end += len(import_end_marker)
          new_import = '''import { createHash } from "node:crypto";

          import { readRpcWorkerV2Fixture } from "./rpc-worker-lifecycle-fixture.mjs";
          import {
            validateArtifact,
            validateRpcWorkerV2ArtifactResults,
            validateRunAttempt,
            validateWorkerArtifactJob,
          } from "./rpc-worker-lifecycle-provenance.mjs";
          '''
          test = new_import + test[import_end:]

          anchor = 'console.log("RPC Worker v2 provenance metadata: OK");\n'
          regression = r'''
          function crc32(bytes) {
            let crc = 0xffffffff;
            for (const byte of bytes) {
              crc ^= byte;
              for (let bit = 0; bit < 8; bit += 1) {
                crc = (crc >>> 1) ^ (crc & 1 ? 0xedb88320 : 0);
              }
            }
            return (crc ^ 0xffffffff) >>> 0;
          }

          function storedZip(name, content) {
            const filename = Buffer.from(name, "utf8");
            const checksum = crc32(content);
            const local = Buffer.alloc(30);
            local.writeUInt32LE(0x04034b50, 0);
            local.writeUInt16LE(20, 4);
            local.writeUInt32LE(checksum, 14);
            local.writeUInt32LE(content.length, 18);
            local.writeUInt32LE(content.length, 22);
            local.writeUInt16LE(filename.length, 26);

            const central = Buffer.alloc(46);
            central.writeUInt32LE(0x02014b50, 0);
            central.writeUInt16LE(20, 4);
            central.writeUInt16LE(20, 6);
            central.writeUInt32LE(checksum, 16);
            central.writeUInt32LE(content.length, 20);
            central.writeUInt32LE(content.length, 24);
            central.writeUInt16LE(filename.length, 28);

            const centralOffset = local.length + filename.length + content.length;
            const centralSize = central.length + filename.length;
            const end = Buffer.alloc(22);
            end.writeUInt32LE(0x06054b50, 0);
            end.writeUInt16LE(1, 8);
            end.writeUInt16LE(1, 10);
            end.writeUInt32LE(centralSize, 12);
            end.writeUInt32LE(centralOffset, 16);
            return Buffer.concat([local, filename, content, central, filename, end]);
          }

          function artifactManifest(sourceZip, comparisonZip, resultBytes) {
            return {
              source: {
                artifactDigest: `sha256:${createHash("sha256").update(sourceZip).digest("hex")}`,
              },
              stability: {
                comparisonArtifactDigest:
                  `sha256:${createHash("sha256").update(comparisonZip).digest("hex")}`,
                artifactResultJsonBytes: resultBytes.length,
                artifactResultJsonSha256:
                  createHash("sha256").update(resultBytes).digest("hex"),
              },
            };
          }

          const committedFixture = await readRpcWorkerV2Fixture();
          const normalizedArtifactResult = structuredClone(committedFixture.result);
          const providerErrorCase =
            normalizedArtifactResult.capture.cases.acceptedProviderError;
          requireValue(
            providerErrorCase.acceptanceStateProbe?.excludedFromFrozenFixture === true &&
              !Object.hasOwn(providerErrorCase, "stateDuring") &&
              !providerErrorCase.worker.transcript.some(
                (record) =>
                  record.kind === "response" &&
                  record.id === "provider-error-state-during" &&
                  record.command === "get_state",
              ),
            "RPC Worker normalized Artifact test source is not already normalized.",
          );
          const normalizedResultBytes = Buffer.from(
            `${JSON.stringify(normalizedArtifactResult, null, 2)}\n`,
            "utf8",
          );
          const normalizedSourceZip = storedZip("result.json", normalizedResultBytes);
          const normalizedComparisonZip = storedZip("result.json", normalizedResultBytes);
          validateRpcWorkerV2ArtifactResults({
            manifest: artifactManifest(
              normalizedSourceZip,
              normalizedComparisonZip,
              normalizedResultBytes,
            ),
            committedResult: committedFixture.result,
            sourceZip: normalizedSourceZip,
            comparisonZip: normalizedComparisonZip,
          });

          const driftedArtifactResult = structuredClone(normalizedArtifactResult);
          driftedArtifactResult.capture.cases.acceptedProviderError.acceptanceStateProbe.requestId =
            "drifted-provider-error-state";
          const driftedResultBytes = Buffer.from(
            `${JSON.stringify(driftedArtifactResult, null, 2)}\n`,
            "utf8",
          );
          const driftedSourceZip = storedZip("result.json", driftedResultBytes);
          const driftedComparisonZip = storedZip("result.json", driftedResultBytes);
          expectFailure(
            "normalized Artifact content drift",
            () =>
              validateRpcWorkerV2ArtifactResults({
                manifest: artifactManifest(
                  driftedSourceZip,
                  driftedComparisonZip,
                  driftedResultBytes,
                ),
                committedResult: committedFixture.result,
                sourceZip: driftedSourceZip,
                comparisonZip: driftedComparisonZip,
              }),
            /does not equal the complete committed v2 Fixture/,
          );

          '''
          if test.count(anchor) != 1:
              raise SystemExit("provenance test tail identity drifted")
          test_path.write_text(test.replace(anchor, regression + anchor, 1), encoding="utf-8")
          PY

      - name: Validate repaired boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check packages/pi-adapter/fixtures/pi-lifecycle-sdk-rpc-parity/rpc-worker-lifecycle-provenance.mjs
          node --check packages/pi-adapter/fixtures/pi-lifecycle-sdk-rpc-parity/rpc-worker-lifecycle-provenance.test.mjs
          node packages/pi-adapter/fixtures/pi-lifecycle-sdk-rpc-parity/rpc-worker-lifecycle-provenance.test.mjs
          npm run check:pi-rpc-worker-lifecycle
          git diff --check

      - name: Commit repaired code and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr66-rpc-provenance-fix.yml
          rm .github/workflows/pr66-rpc-provenance-fix-v2.yml
          git add -A
          git config user.name "zhiwei provenance repair"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(provenance): validate normalized RPC Worker artifacts"
          git push origin HEAD:feat/49-normalized-runtime-event-v1
