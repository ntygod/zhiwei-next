name: AI delete accidental scratch branches

on:
  push:
    branches:
      - chore/cleanup-compaction-ai-orchestration
    paths:
      - .github/ai-delete-accidental-branches-trigger

permissions:
  contents: write

jobs:
  delete-branches:
    if: github.event.head_commit.message == 'chore(harness): remove accidental scratch branches'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete exact accidental refs only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            tmp-do-not-create \
            ignore-this-test \
            ignore-this-test-2 \
            ignore-this-test-3 \
            ignore-this-test-4
          do
            encoded="${branch//\//%2F}"
            status="$(curl -sS -o "$RUNNER_TEMP/response.json" -w '%{http_code}' \
              -X DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/git/refs/heads/$encoded")"
            case "$status" in
              204)
                echo "Deleted $branch"
                ;;
              422)
                echo "$branch was already absent"
                ;;
              *)
                cat "$RUNNER_TEMP/response.json" >&2
                echo "Unexpected HTTP status $status while deleting $branch" >&2
                exit 1
                ;;
            esac
          done
