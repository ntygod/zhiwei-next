name: AI apply SDK-RPC import fix

on:
  push:
    branches:
      - spike/m0-pi-sdk-rpc-prompt
    paths:
      - .github/ai-sdk-rpc-fix-trigger

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.head_commit.message == 'chore(ai): trigger SDK-RPC import fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout work branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: spike/m0-pi-sdk-rpc-prompt
          persist-credentials: true
          fetch-depth: 0

      - name: Apply deterministic import fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/probes/pi-sdk-rpc-prompt-capture.mjs')
          source = path.read_text(encoding='utf-8')
          old = 'import { dirname, fileURLToPath, join, resolve } from "node:path";\nimport { pathToFileURL } from "node:url";'
          new = 'import { dirname, join, resolve } from "node:path";\nimport { fileURLToPath, pathToFileURL } from "node:url";'
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one node:path/node:url import target.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/ai-sdk-rpc-fix-trigger
          rm -f .github/workflows/ai-apply-sdk-rpc-fix.yml
          node --check scripts/probes/pi-sdk-rpc-prompt-capture.mjs
          npm run check:architecture
          npm run check:harness
          git diff --check

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(spike): import fileURLToPath from node:url"
          git push origin HEAD:spike/m0-pi-sdk-rpc-prompt
