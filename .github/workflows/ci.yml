name: CI
run-name: ci | event=${{ github.event_name }} | pr=${{ github.event.pull_request.number || 'none' }} | action=${{ github.event.action || 'none' }} | updated_at=${{ github.event.pull_request.updated_at || 'none' }} | ready=${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }} | base=${{ github.event.pull_request.base.sha || 'none' }} | head=${{ github.event.pull_request.head.sha || github.sha }} | run=${{ github.run_id }}

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      run_pi_artifact_probe:
        description: Run the isolated Pi npm Artifact probe
        required: false
        default: false
        type: boolean
      run_pi_lifecycle_probe:
        description: Run the isolated Pi SDK + Extension lifecycle probes
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    name: Static contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pi-artifact-probe: ${{ steps.probe-gate.outputs.artifact-required }}
      pi-lifecycle-probe: ${{ steps.probe-gate.outputs.lifecycle-required }}
      pi-parallel-tool-ordering-required: ${{ steps.changed-files.outputs.pi-parallel-tool-ordering-required }}
      pi-compaction-session-replacement-required: ${{ steps.changed-files.outputs.pi-compaction-session-replacement-required }}
      pi-sdk-rpc-parity-required: ${{ steps.changed-files.outputs.pi-sdk-rpc-parity-required }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Architecture, Harness and tests
        run: npm run check

      - name: Read pull request changed files
        if: github.event_name == 'pull_request'
        id: changed-files
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          result-encoding: string
          script: |
            const changedFileCount = context.payload.pull_request?.changed_files;
            if (!Number.isSafeInteger(changedFileCount) || changedFileCount < 0) {
              throw new Error("Pull request changed_files count is invalid.");
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            if (files.length !== changedFileCount) {
              throw new Error(
                `Pull request file enumeration is incomplete: event=${changedFileCount}, ` +
                  `api=${files.length}.`,
              );
            }
            const filenames = [
              ...new Set(
                files.flatMap((file) => [
                  file.filename,
                  ...(file.status === "renamed" && file.previous_filename
                    ? [file.previous_filename]
                    : []),
                ]),
              ),
            ];
            const artifactProbePaths = [
              ".github/workflows/ci.yml",
              "packages/pi-adapter/fixtures/pi-upstream-baseline.json",
              "packages/pi-adapter/fixtures/pi-artifact-runtime.json",
              "scripts/check-pi-artifact-result.mjs",
              "scripts/probes/pi-artifact-ci.mjs",
              "scripts/probes/pi-sdk-surface.mjs",
              "scripts/probes/pi-rpc-state.mjs",
              "docs/spikes/pi-runtime-contract/README.md",
            ];
            const lifecycleProbePaths = [
              ".github/workflows/ci.yml",
              "packages/pi-adapter/fixtures/pi-upstream-baseline.json",
              "packages/pi-adapter/fixtures/pi-lifecycle-normal-tool.json",
              "packages/pi-adapter/fixtures/pi-lifecycle-retry-success.json",
              "packages/pi-adapter/fixtures/pi-lifecycle-follow-up-queue.json",
              "packages/pi-adapter/fixtures/pi-lifecycle-cancel-retry-exhaustion.json",
              "scripts/check-pi-lifecycle-result.mjs",
              "scripts/check-pi-retry-lifecycle-result.mjs",
              "scripts/check-pi-follow-up-lifecycle-result.mjs",
              "scripts/check-pi-cancel-retry-exhaustion-result.mjs",
              "scripts/probes/pi-lifecycle-ci.mjs",
              "scripts/probes/pi-lifecycle-capture.mjs",
              "scripts/probes/pi-retry-lifecycle-capture.mjs",
              "scripts/probes/pi-follow-up-lifecycle-capture.mjs",
              "scripts/probes/pi-cancel-retry-exhaustion-capture.mjs",
              "docs/spikes/pi-runtime-contract/README.md",
              "docs/spikes/pi-runtime-contract/retry-success-lifecycle.md",
              "docs/spikes/pi-runtime-contract/follow-up-queue-lifecycle.md",
              "docs/spikes/pi-runtime-contract/cancel-retry-exhaustion-lifecycle.md",
              "docs/architecture/pi-integration.md",
            ];
            const parallelToolOrderingPaths = [
              ".github/workflows/pi-parallel-tool-ordering.yml",
              ".github/workflows/ci.yml",
              "harness.config.json",
              "scripts/check-harness.mjs",
              "docs/harness/main-protection.md",
              "package.json",
              "packages/pi-adapter/fixtures/pi-upstream-baseline.json",
              "packages/pi-adapter/fixtures/pi-lifecycle-parallel-tool-ordering.json",
              "scripts/check-pi-parallel-tool-ordering-result.mjs",
              "scripts/probes/pi-lifecycle-ci.mjs",
              "scripts/probes/pi-parallel-tool-ordering-capture.mjs",
              "docs/spikes/pi-runtime-contract/README.md",
              "docs/spikes/pi-runtime-contract/parallel-tool-ordering-lifecycle.md",
              "docs/architecture/pi-integration.md",
            ];
            const compactionSessionReplacementPaths = [
              ".github/workflows/pi-compaction-session-replacement.yml",
              ".github/workflows/ci.yml",
              "harness.config.json",
              "scripts/check-harness.mjs",
              "docs/harness/main-protection.md",
              "package.json",
              "packages/pi-adapter/fixtures/pi-upstream-baseline.json",
              "packages/pi-adapter/fixtures/pi-lifecycle-compaction-session-replacement.json",
              "scripts/check-pi-compaction-session-replacement-result.mjs",
              "scripts/probes/pi-lifecycle-ci.mjs",
              "scripts/probes/pi-compaction-session-replacement-capture.mjs",
              "docs/spikes/pi-runtime-contract/README.md",
              "docs/spikes/pi-runtime-contract/compaction-session-replacement-lifecycle.md",
              "docs/architecture/pi-integration.md",
              "docs/harness/project-state.md",
            ];
            const sdkRpcParityPaths = [
              ".github/workflows/pi-sdk-rpc-parity.yml",
              ".github/workflows/ci.yml",
              "harness.config.json",
              "scripts/check-harness.mjs",
              "docs/harness/main-protection.md",
              "package.json",
              "packages/pi-adapter/fixtures/pi-upstream-baseline.json",
              "packages/pi-adapter/fixtures/pi-lifecycle-sdk-rpc-parity/**",
              "scripts/check-pi-sdk-rpc-parity-result.mjs",
              "scripts/check-pi-sdk-rpc-client-messages-result.mjs",
              "scripts/check-pi-sdk-rpc-parity-provenance.mjs",
              "scripts/pi-sdk-rpc-parity-fixture.mjs",
              "scripts/probes/pi-lifecycle-ci.mjs",
              "scripts/probes/pi-sdk-rpc-parity-contract.mjs",
              "scripts/probes/pi-sdk-rpc-parity-faux-extension.mjs",
              "scripts/probes/pi-sdk-rpc-parity-capture.mjs",
              "scripts/probes/pi-sdk-rpc-parity-composite-capture.mjs",
              "docs/spikes/pi-runtime-contract/README.md",
              "docs/spikes/pi-runtime-contract/sdk-rpc-parity-lifecycle.md",
              "docs/architecture/pi-integration.md",
              "docs/harness/project-state.md",
            ];
            const matchesWorkflowPaths = (filename, patterns) =>
              patterns.some((pattern) =>
                pattern.endsWith("/**")
                  ? filename.startsWith(pattern.slice(0, -2))
                  : filename === pattern,
              );
            core.setOutput(
              "pi-artifact-probe",
              String(filenames.some((filename) => artifactProbePaths.includes(filename))),
            );
            core.setOutput(
              "pi-lifecycle-probe",
              String(filenames.some((filename) => lifecycleProbePaths.includes(filename))),
            );
            core.setOutput(
              "pi-parallel-tool-ordering-required",
              String(
                filenames.some((filename) =>
                  matchesWorkflowPaths(filename, parallelToolOrderingPaths),
                ),
              ),
            );
            core.setOutput(
              "pi-compaction-session-replacement-required",
              String(
                filenames.some((filename) =>
                  matchesWorkflowPaths(filename, compactionSessionReplacementPaths),
                ),
              ),
            );
            core.setOutput(
              "pi-sdk-rpc-parity-required",
              String(
                filenames.some((filename) =>
                  matchesWorkflowPaths(filename, sdkRpcParityPaths),
                ),
              ),
            );
            return JSON.stringify(filenames);

      - name: Validate work item GitHub objects
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const body = context.payload.pull_request?.body ?? "";
            const marker = "zhiwei-harness";
            const markerIndex = body.lastIndexOf(marker);
            const commentStart = body.lastIndexOf("<!--", markerIndex);
            const commentEnd = body.indexOf("-->", markerIndex + marker.length);
            if (markerIndex < 0 || commentStart < 0 || commentEnd < 0) {
              throw new Error("Missing zhiwei-harness metadata block.");
            }

            const metadata = {};
            const block = body.slice(markerIndex + marker.length, commentEnd);
            for (const rawLine of block.split(/\r?\n/)) {
              const line = rawLine.trim();
              const separator = line.indexOf(":");
              if (!line || separator < 0) continue;
              metadata[line.slice(0, separator).trim()] =
                line.slice(separator + 1).trim();
            }

            const parseReference = (field, { allowNone = false } = {}) => {
              const value = metadata[field];
              if (allowNone && value === "none") return null;
              const match = /^#([1-9]\d*)$/.exec(value ?? "");
              if (!match) {
                throw new Error(
                  `${field} must be an object reference in the form #N` +
                    (allowNone ? " or none." : "."),
                );
              }
              return Number(match[1]);
            };

            const { owner, repo } = context.repo;
            const currentPullRequest = context.payload.pull_request.number;
            const workItem = parseReference("work-item");
            const ownerInput = parseReference("owner-input", { allowNone: true });
            const supersedesPr = parseReference("supersedes-pr", { allowNone: true });

            const { data: workItemData } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: workItem,
            });
            if (workItemData.pull_request) {
              throw new Error(`work-item #${workItem} resolves to a Pull Request.`);
            }
            if (workItemData.state !== "open") {
              throw new Error(`work-item #${workItem} must be open before merge.`);
            }

            if (ownerInput !== null) {
              const { data: ownerInputData } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: ownerInput,
              });
              if (ownerInputData.pull_request) {
                throw new Error(`owner-input #${ownerInput} resolves to a Pull Request.`);
              }
              if (ownerInputData.user?.login !== owner) {
                throw new Error(
                  `owner-input #${ownerInput} was not authored by repository owner ${owner}.`,
                );
              }
            }

            if (supersedesPr !== null) {
              if (supersedesPr === currentPullRequest) {
                throw new Error("supersedes-pr cannot reference the current Pull Request.");
              }
              await github.rest.pulls.get({
                owner,
                repo,
                pull_number: supersedesPr,
              });
            }

            core.info(
              `Verified work-item #${workItem}; owner-input ` +
                `${ownerInput === null ? "none" : `#${ownerInput}`}; ` +
                `supersedes-pr ${supersedesPr === null ? "none" : `#${supersedesPr}`}.`,
            );

      - name: Read manual Pi probe requests
        if: github.event_name == 'workflow_dispatch'
        id: manual-probe
        env:
          RUN_PI_ARTIFACT_PROBE: ${{ inputs.run_pi_artifact_probe }}
          RUN_PI_LIFECYCLE_PROBE: ${{ inputs.run_pi_lifecycle_probe }}
        run: |
          echo "pi-artifact-probe=${RUN_PI_ARTIFACT_PROBE}" >> "$GITHUB_OUTPUT"
          echo "pi-lifecycle-probe=${RUN_PI_LIFECYCLE_PROBE}" >> "$GITHUB_OUTPUT"

      - name: Resolve Pi probe gates
        id: probe-gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          ARTIFACT_PR_GATE: ${{ steps.changed-files.outputs.pi-artifact-probe || 'false' }}
          LIFECYCLE_PR_GATE: ${{ steps.changed-files.outputs.pi-lifecycle-probe || 'false' }}
          ARTIFACT_MANUAL_GATE: ${{ steps.manual-probe.outputs.pi-artifact-probe || 'false' }}
          LIFECYCLE_MANUAL_GATE: ${{ steps.manual-probe.outputs.pi-lifecycle-probe || 'false' }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$ARTIFACT_PR_GATE" == "true" || "$ARTIFACT_MANUAL_GATE" == "true" ]]; then
            echo "artifact-required=true" >> "$GITHUB_OUTPUT"
          else
            echo "artifact-required=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$EVENT_NAME" == "schedule" || "$LIFECYCLE_PR_GATE" == "true" || "$LIFECYCLE_MANUAL_GATE" == "true" ]]; then
            echo "lifecycle-required=true" >> "$GITHUB_OUTPUT"
          else
            echo "lifecycle-required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate autonomous pull request contract
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          CHANGED_FILES_JSON: ${{ steps.changed-files.outputs.result }}
        run: npm run check:pr

  pi-artifact-probe:
    name: Pi npm Artifact probe
    needs: static-contracts
    if: needs.static-contracts.outputs.pi-artifact-probe == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup exact Node.js runtime for host validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1

      - name: Probe exact Pi npm Artifact in sandbox
        env:
          PI_PROBE_IMAGE: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/zhiwei-pi-artifact-bundle"
          RESULT_DIR="$RUNNER_TEMP/zhiwei-pi-artifact-result"
          mkdir -p "$BUNDLE" "$RESULT_DIR"
          tar -cf - \
            packages/pi-adapter/fixtures/pi-upstream-baseline.json \
            scripts/probes/pi-artifact-ci.mjs \
            scripts/probes/pi-sdk-surface.mjs \
            scripts/probes/pi-rpc-state.mjs \
            | tar -xf - -C "$BUNDLE"
          chmod -R a-w "$BUNDLE"
          chmod 0777 "$RESULT_DIR"

          docker run --rm \
            --network=bridge \
            --read-only \
            --user=1000:1000 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=256 \
            --memory=2g \
            --cpus=2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=1536m,uid=1000,gid=1000,mode=1777 \
            --mount type=bind,src="$BUNDLE",dst=/probe,readonly \
            --mount type=bind,src="$RESULT_DIR",dst=/output \
            --workdir /probe \
            --env HOME=/tmp/home \
            --env CI=true \
            --env GITHUB_ACTIONS=true \
            --env PI_PROBE_OUTPUT=/output/result.json \
            --env PI_PROBE_SOURCE_READ_ONLY=true \
            --env PI_PROBE_HOST_WORKSPACE_MOUNTED=false \
            --env PI_PROBE_CONTAINER_ROOT_READ_ONLY=true \
            --env PI_PROBE_CAPABILITIES_DROPPED=true \
            --env PI_PROBE_NO_NEW_PRIVILEGES=true \
            --env PI_PROBE_CONTAINER_IMAGE="$PI_PROBE_IMAGE" \
            "$PI_PROBE_IMAGE" \
            node scripts/probes/pi-artifact-ci.mjs

      - name: Validate sanitized runtime evidence
        env:
          PI_PROBE_OUTPUT: ${{ runner.temp }}/zhiwei-pi-artifact-result/result.json
        run: node scripts/check-pi-artifact-result.mjs "$PI_PROBE_OUTPUT"

      - name: Upload sanitized probe evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-artifact-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zhiwei-pi-artifact-result/result.json
          if-no-files-found: error
          retention-days: 14

  pi-lifecycle-probe:
    name: Pi SDK and Extension lifecycle probe
    needs: static-contracts
    if: needs.static-contracts.outputs.pi-lifecycle-probe == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup exact Node.js runtime for host validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1

      - name: Capture Pi lifecycle in sandbox
        env:
          PI_PROBE_IMAGE: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/zhiwei-pi-lifecycle-bundle"
          RESULT_DIR="$RUNNER_TEMP/zhiwei-pi-lifecycle-result"
          mkdir -p "$BUNDLE" "$RESULT_DIR"
          tar -cf - \
            packages/pi-adapter/fixtures/pi-upstream-baseline.json \
            scripts/probes/pi-lifecycle-ci.mjs \
            scripts/probes/pi-lifecycle-capture.mjs \
            | tar -xf - -C "$BUNDLE"
          if [[ -f packages/pi-adapter/fixtures/pi-lifecycle-normal-tool.json ]]; then
            tar -cf - packages/pi-adapter/fixtures/pi-lifecycle-normal-tool.json | tar -xf - -C "$BUNDLE"
          fi
          chmod -R a-w "$BUNDLE"
          chmod 0777 "$RESULT_DIR"

          COMMITTED_ARGS=()
          if [[ -f "$BUNDLE/packages/pi-adapter/fixtures/pi-lifecycle-normal-tool.json" ]]; then
            COMMITTED_ARGS+=(
              --env PI_LIFECYCLE_COMMITTED_FIXTURE=/probe/packages/pi-adapter/fixtures/pi-lifecycle-normal-tool.json
            )
          fi

          docker run --rm \
            --network=bridge \
            --read-only \
            --user=1000:1000 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=256 \
            --memory=2g \
            --cpus=2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=1536m,uid=1000,gid=1000,mode=1777 \
            --mount type=bind,src="$BUNDLE",dst=/probe,readonly \
            --mount type=bind,src="$RESULT_DIR",dst=/output \
            --workdir /probe \
            --env HOME=/tmp/home \
            --env CI=true \
            --env GITHUB_ACTIONS=true \
            --env PI_LIFECYCLE_OUTPUT=/output/result.json \
            --env PI_LIFECYCLE_SCENARIO=normal-tool \
            --env PI_LIFECYCLE_CAPTURE_SCRIPT=/probe/scripts/probes/pi-lifecycle-capture.mjs \
            --env PI_PROBE_SOURCE_READ_ONLY=true \
            --env PI_PROBE_HOST_WORKSPACE_MOUNTED=false \
            --env PI_PROBE_CONTAINER_ROOT_READ_ONLY=true \
            --env PI_PROBE_CAPABILITIES_DROPPED=true \
            --env PI_PROBE_NO_NEW_PRIVILEGES=true \
            --env PI_PROBE_CONTAINER_IMAGE="$PI_PROBE_IMAGE" \
            "${COMMITTED_ARGS[@]}" \
            "$PI_PROBE_IMAGE" \
            node scripts/probes/pi-lifecycle-ci.mjs

      - name: Validate sanitized lifecycle evidence
        env:
          PI_LIFECYCLE_OUTPUT: ${{ runner.temp }}/zhiwei-pi-lifecycle-result/result.json
        run: node scripts/check-pi-lifecycle-result.mjs "$PI_LIFECYCLE_OUTPUT"

      - name: Upload sanitized lifecycle evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-lifecycle-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zhiwei-pi-lifecycle-result/result.json
          if-no-files-found: error
          retention-days: 14

  pi-retry-lifecycle-probe:
    name: Pi automatic retry lifecycle probe
    needs: static-contracts
    if: needs.static-contracts.outputs.pi-lifecycle-probe == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup exact Node.js runtime for host validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1

      - name: Capture Pi automatic retry lifecycle in sandbox
        env:
          PI_PROBE_IMAGE: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/zhiwei-pi-retry-lifecycle-bundle"
          RESULT_DIR="$RUNNER_TEMP/zhiwei-pi-retry-lifecycle-result"
          mkdir -p "$BUNDLE" "$RESULT_DIR"
          tar -cf - \
            packages/pi-adapter/fixtures/pi-upstream-baseline.json \
            scripts/probes/pi-lifecycle-ci.mjs \
            scripts/probes/pi-retry-lifecycle-capture.mjs \
            | tar -xf - -C "$BUNDLE"
          if [[ -f packages/pi-adapter/fixtures/pi-lifecycle-retry-success.json ]]; then
            tar -cf - packages/pi-adapter/fixtures/pi-lifecycle-retry-success.json | tar -xf - -C "$BUNDLE"
          fi
          chmod -R a-w "$BUNDLE"
          chmod 0777 "$RESULT_DIR"

          COMMITTED_ARGS=()
          if [[ -f "$BUNDLE/packages/pi-adapter/fixtures/pi-lifecycle-retry-success.json" ]]; then
            COMMITTED_ARGS+=(
              --env PI_LIFECYCLE_COMMITTED_FIXTURE=/probe/packages/pi-adapter/fixtures/pi-lifecycle-retry-success.json
            )
          fi

          docker run --rm \
            --network=bridge \
            --read-only \
            --user=1000:1000 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=256 \
            --memory=2g \
            --cpus=2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=1536m,uid=1000,gid=1000,mode=1777 \
            --mount type=bind,src="$BUNDLE",dst=/probe,readonly \
            --mount type=bind,src="$RESULT_DIR",dst=/output \
            --workdir /probe \
            --env HOME=/tmp/home \
            --env CI=true \
            --env GITHUB_ACTIONS=true \
            --env PI_LIFECYCLE_OUTPUT=/output/result.json \
            --env PI_LIFECYCLE_SCENARIO=retry-success \
            --env PI_LIFECYCLE_CAPTURE_SCRIPT=/probe/scripts/probes/pi-retry-lifecycle-capture.mjs \
            --env PI_PROBE_SOURCE_READ_ONLY=true \
