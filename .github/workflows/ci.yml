name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      run_pi_artifact_probe:
        description: Run the isolated Pi npm Artifact probe
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pi-artifact-probe: ${{ steps.probe-gate.outputs.required }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Architecture, Harness and tests
        run: npm run check

      - name: Read pull request changed files
        if: github.event_name == 'pull_request'
        id: changed-files
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          result-encoding: string
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const filenames = files.map((file) => file.filename);
            const probePaths = [
              ".github/workflows/ci.yml",
              "packages/pi-adapter/fixtures/pi-upstream-baseline.json",
              "packages/pi-adapter/fixtures/pi-artifact-runtime.json",
              "scripts/check-pi-artifact-result.mjs",
              "scripts/probes/pi-artifact-ci.mjs",
              "scripts/probes/pi-sdk-surface.mjs",
              "scripts/probes/pi-rpc-state.mjs",
              "docs/spikes/pi-runtime-contract/README.md",
            ];
            const required = filenames.some((filename) => probePaths.includes(filename));
            core.setOutput("pi-artifact-probe", String(required));
            return JSON.stringify(filenames);

      - name: Read manual Pi Artifact probe request
        if: github.event_name == 'workflow_dispatch'
        id: manual-probe
        env:
          RUN_PI_ARTIFACT_PROBE: ${{ inputs.run_pi_artifact_probe }}
        run: echo "pi-artifact-probe=${RUN_PI_ARTIFACT_PROBE}" >> "$GITHUB_OUTPUT"

      - name: Resolve Pi Artifact probe gate
        id: probe-gate
        env:
          PR_GATE: ${{ steps.changed-files.outputs.pi-artifact-probe || 'false' }}
          MANUAL_GATE: ${{ steps.manual-probe.outputs.pi-artifact-probe || 'false' }}
        run: |
          if [[ "$PR_GATE" == "true" || "$MANUAL_GATE" == "true" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate autonomous pull request contract
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          CHANGED_FILES_JSON: ${{ steps.changed-files.outputs.result }}
        run: npm run check:pr

  pi-artifact-probe:
    name: Pi npm Artifact probe
    needs: check
    if: needs.check.outputs.pi-artifact-probe == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup exact Node.js runtime for host validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1

      - name: Probe exact Pi npm Artifact in sandbox
        env:
          PI_PROBE_IMAGE: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/zhiwei-pi-artifact-bundle"
          RESULT_DIR="$RUNNER_TEMP/zhiwei-pi-artifact-result"
          mkdir -p "$BUNDLE" "$RESULT_DIR"
          tar -cf - \
            packages/pi-adapter/fixtures/pi-upstream-baseline.json \
            scripts/probes/pi-artifact-ci.mjs \
            scripts/probes/pi-sdk-surface.mjs \
            scripts/probes/pi-rpc-state.mjs \
            | tar -xf - -C "$BUNDLE"
          chmod -R a-w "$BUNDLE"
          chmod 0777 "$RESULT_DIR"

          docker run --rm \
            --network=bridge \
            --read-only \
            --user=1000:1000 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=256 \
            --memory=2g \
            --cpus=2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=1536m,uid=1000,gid=1000,mode=1777 \
            --mount type=bind,src="$BUNDLE",dst=/probe,readonly \
            --mount type=bind,src="$RESULT_DIR",dst=/output \
            --workdir /probe \
            --env HOME=/tmp/home \
            --env CI=true \
            --env GITHUB_ACTIONS=true \
            --env PI_PROBE_OUTPUT=/output/result.json \
            --env PI_PROBE_SOURCE_READ_ONLY=true \
            --env PI_PROBE_HOST_WORKSPACE_MOUNTED=false \
            --env PI_PROBE_CONTAINER_ROOT_READ_ONLY=true \
            --env PI_PROBE_CAPABILITIES_DROPPED=true \
            --env PI_PROBE_NO_NEW_PRIVILEGES=true \
            --env PI_PROBE_CONTAINER_IMAGE="$PI_PROBE_IMAGE" \
            "$PI_PROBE_IMAGE" \
            node scripts/probes/pi-artifact-ci.mjs

      - name: Validate sanitized runtime evidence
        env:
          PI_PROBE_OUTPUT: ${{ runner.temp }}/zhiwei-pi-artifact-result/result.json
        run: node scripts/check-pi-artifact-result.mjs "$PI_PROBE_OUTPUT"

      - name: Upload sanitized probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-artifact-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zhiwei-pi-artifact-result/result.json
          if-no-files-found: error
          retention-days: 14
