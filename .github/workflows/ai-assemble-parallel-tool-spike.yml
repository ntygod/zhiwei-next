name: AI assemble parallel Tool ordering spike

on:
  push:
    branches:
      - spike/m0-pi-parallel-tool-ordering

permissions:
  contents: write

concurrency:
  group: ai-assemble-parallel-tool-ordering
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout assembly branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: spike/m0-pi-parallel-tool-ordering
          fetch-depth: 0
          persist-credentials: true

      - name: Restore and commit non-workflow source payload
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G '.github/ai-payload/parallel-tool-ordering/part-*' > /dev/null; then
            echo "Assembly payload is already consumed."
            exit 0
          fi

          cat .github/ai-payload/parallel-tool-ordering/part-* > "$RUNNER_TEMP/parallel-tool-ordering.b64"
          base64 --decode "$RUNNER_TEMP/parallel-tool-ordering.b64" > "$RUNNER_TEMP/parallel-tool-ordering.txz"
          echo "e2a2297f2fec9bb45030b043beffc5a14e2792336b2b99e229e5831ee966a329  $RUNNER_TEMP/parallel-tool-ordering.txz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/parallel-tool-ordering.txz"

          # This GitHub App token may not write Workflow files. Keep CI for a
          # separate connector-authorized update while committing the source.
          git restore --source=HEAD -- .github/workflows/ci.yml

          node --check scripts/check-pi-parallel-tool-ordering-result.mjs
          node --check scripts/probes/pi-parallel-tool-ordering-capture.mjs
          node -e 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8"))'
          rm -rf .github/ai-payload/parallel-tool-ordering
          git add package.json scripts/check-pi-parallel-tool-ordering-result.mjs scripts/probes/pi-parallel-tool-ordering-capture.mjs .github/ai-payload/parallel-tool-ordering
          git diff --cached --check
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git commit -m "spike(m0): add parallel Tool ordering capture"
          git push origin HEAD:spike/m0-pi-parallel-tool-ordering
