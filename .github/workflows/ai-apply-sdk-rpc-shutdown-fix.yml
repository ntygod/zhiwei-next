name: AI SDK RPC shutdown expectation patch

on:
  push:
    branches:
      - spike/m0-pi-sdk-rpc-prompt
    paths:
      - .github/ai-sdk-rpc-shutdown-fix-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout work branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: spike/m0-pi-sdk-rpc-prompt
          persist-credentials: true
          fetch-depth: 0

      - name: Preserve observed RPC shutdown reason
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE=scripts/probes/pi-sdk-rpc-prompt-capture.mjs
          CHECKER=scripts/check-pi-sdk-rpc-prompt-result.mjs
          test "$(grep -Fc 'extensionEvidence.shutdown?.reason === "exit"' "$CAPTURE")" -eq 2
          test "$(grep -Fc 'shutdown(reason=exit)' "$CAPTURE")" -eq 1
          test "$(grep -Fc 'extensionEvidence?.shutdown?.reason === "exit"' "$CHECKER")" -eq 1
          test "$(grep -Fc 'shutdown(reason=exit)' "$CHECKER")" -eq 1
          sed -i 's/extensionEvidence\.shutdown?.reason === "exit"/extensionEvidence.shutdown?.reason === "quit"/g' "$CAPTURE"
          sed -i 's/shutdown(reason=exit)/shutdown(reason=quit)/g' "$CAPTURE"
          sed -i 's/extensionEvidence?.shutdown?.reason === "exit"/extensionEvidence?.shutdown?.reason === "quit"/g' "$CHECKER"
          sed -i 's/shutdown(reason=exit)/shutdown(reason=quit)/g' "$CHECKER"
          rm -f .github/ai-sdk-rpc-rerun .github/ai-sdk-rpc-shutdown-fix-trigger
          rm -f .github/workflows/ai-apply-sdk-rpc-shutdown-fix.yml
          node --check "$CAPTURE"
          node --check "$CHECKER"
          npm run check:architecture
          npm run check:harness
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(spike): preserve RPC shutdown reason quit"
          git push origin HEAD:spike/m0-pi-sdk-rpc-prompt
