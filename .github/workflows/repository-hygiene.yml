name: Repository Hygiene

on:
  workflow_run:
    workflows: ["Autonomous Merge"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "19 5 * * 1"

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: repository-hygiene-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted default-branch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Reconcile work items and legacy helper branches
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const { readFile } = require("node:fs/promises");
            const { join } = require("node:path");

            const root = process.env.GITHUB_WORKSPACE;
            const policyUrl = pathToFileURL(
              join(root, "scripts/work-item-policy.mjs"),
            ).href;
            const {
              auditRepositoryWorkItems,
              parseHarnessMetadata,
              parseNumberReference,
              runWorkItemPolicySelfTests,
              selectAllowlistedLegacyHelperBranches,
              validatePullRequestWorkItemContract,
            } = await import(policyUrl);

            const config = JSON.parse(
              await readFile(join(root, "harness.config.json"), "utf8"),
            );
            const reconciliation = JSON.parse(
              await readFile(
                join(
                  root,
                  "docs/harness/reconciliation/2026-08-12-work-item-cleanup.json",
                ),
                "utf8",
              ),
            );
            const { owner, repo } = context.repo;
            const repositoryFullName = `${owner}/${repo}`;

            runWorkItemPolicySelfTests();

            const protectionFinding = (message) => ({
              kind: "main-protection-drift",
              severity: "error",
              message,
            });
            const sortedStrings = (value) =>
              Array.isArray(value) ? [...value].sort() : value;
            const jsonEqual = (left, right) =>
              JSON.stringify(left) === JSON.stringify(right);

            const auditMainProtection = async (repository) => {
              const findings = [];
              const requireProtection = (condition, message) => {
                if (!condition) findings.push(protectionFinding(message));
              };
              const rulesetRecordPath = config.mainProtection?.rulesetRecord;
              let record;

              try {
                if (
                  typeof rulesetRecordPath !== "string" ||
                  !rulesetRecordPath.startsWith("docs/harness/rulesets/") ||
                  rulesetRecordPath.includes("..") ||
                  !rulesetRecordPath.endsWith(".json")
                ) {
                  throw new Error("mainProtection.rulesetRecord is not a trusted ruleset record path");
                }
                record = JSON.parse(
                  await readFile(join(root, rulesetRecordPath), "utf8"),
                );
              } catch (error) {
                findings.push(
                  protectionFinding(
                    `Cannot read the configured main Ruleset record: ` +
                      `${error.message ?? String(error)}`,
                  ),
                );
                return findings;
              }

              const expectedRuleset = record.ruleset;
              const expectedRules = Array.isArray(expectedRuleset?.rules)
                ? expectedRuleset.rules
                : [];
              const expectedRule = (type) =>
                expectedRules.find((rule) => rule.type === type);

              requireProtection(
                config.defaultBranch === "main",
                `Harness default branch drifted from main to ` +
                  `${config.defaultBranch ?? "<missing>"}.`,
              );
              requireProtection(
                config.mainProtection?.serverEnforced === true,
                "Harness no longer declares server-enforced main protection.",
              );
              requireProtection(
                record.status === "active-verified",
                `Ruleset record status is ${record.status ?? "<missing>"}, not active-verified.`,
              );
              requireProtection(
                record.repository === repositoryFullName,
                `Ruleset record repository is ${record.repository ?? "<missing>"}, ` +
                  `not ${repositoryFullName}.`,
              );
              requireProtection(
                record.repositoryVisibility === "public",
                `Ruleset record visibility is ` +
                  `${record.repositoryVisibility ?? "<missing>"}, not public.`,
              );
              requireProtection(
                Number.isInteger(expectedRuleset?.id) &&
                  config.mainProtection?.rulesetId === expectedRuleset.id,
                "Harness Ruleset ID does not match the configured Ruleset record.",
              );
              requireProtection(
                expectedRuleset?.target === "branch" &&
                  expectedRuleset?.conditions?.refName?.include?.length === 1 &&
                  expectedRuleset.conditions.refName.include[0] === "~DEFAULT_BRANCH" &&
                  expectedRuleset.conditions.refName.exclude?.length === 0,
                "Configured Ruleset record does not target only the default branch.",
              );

              requireProtection(
                repository.full_name === repositoryFullName,
                `Repository API returned ${repository.full_name ?? "<missing>"}, ` +
                  `not ${repositoryFullName}.`,
              );
              requireProtection(
                repository.visibility === "public" && repository.private === false,
                `Repository visibility drifted to ` +
                  `${repository.visibility ?? "<missing>"}.`,
              );
              requireProtection(
                repository.default_branch === "main",
                `Repository default branch drifted to ` +
                  `${repository.default_branch ?? "<missing>"}.`,
              );

              const expectedMergeSettings = record.repositoryMergeSettings;
              requireProtection(
                expectedMergeSettings?.allowMergeCommit === false &&
                  expectedMergeSettings?.allowSquashMerge === true &&
                  expectedMergeSettings?.allowRebaseMerge === false,
                "Configured repository merge settings are not squash-only.",
              );
              requireProtection(
                repository.allow_merge_commit ===
                    expectedMergeSettings?.allowMergeCommit &&
                  repository.allow_squash_merge ===
                    expectedMergeSettings?.allowSquashMerge &&
                  repository.allow_rebase_merge ===
                    expectedMergeSettings?.allowRebaseMerge,
                "Live repository merge settings drifted from the configured record.",
              );

              const expectedSecurity = record.securityAndAnalysis;
              requireProtection(
                expectedSecurity?.secretScanning === "enabled" &&
                  expectedSecurity?.secretScanningPushProtection === "enabled",
                "Configured security record does not require Secret Scanning and Push Protection.",
              );
              requireProtection(
                repository.security_and_analysis?.secret_scanning?.status ===
                    expectedSecurity?.secretScanning &&
                  repository.security_and_analysis?.secret_scanning_push_protection
                    ?.status ===
                    expectedSecurity?.secretScanningPushProtection,
                "Live Secret Scanning or Push Protection is unavailable or drifted from the configured record.",
              );

              let mainBranch;
              try {
                ({ data: mainBranch } = await github.rest.repos.getBranch({
                  owner,
                  repo,
                  branch: "main",
                }));
              } catch (error) {
                findings.push(
                  protectionFinding(
                    `Cannot read live main branch protection: ` +
                      `${error.message ?? String(error)}`,
                  ),
                );
              }
              if (mainBranch) {
                requireProtection(
                  mainBranch.name === "main" && mainBranch.protected === true,
                  "The live main branch is not protected.",
                );
              }

              let liveRuleset;
              if (Number.isInteger(expectedRuleset?.id)) {
                try {
                  ({ data: liveRuleset } = await github.request(
                    "GET /repos/{owner}/{repo}/rulesets/{ruleset_id}",
                    {
                      owner,
                      repo,
                      ruleset_id: expectedRuleset.id,
                    },
                  ));
                } catch (error) {
                  findings.push(
                    protectionFinding(
                      `Cannot read live Ruleset ${expectedRuleset.id}: ` +
                        `${error.message ?? String(error)}`,
                    ),
                  );
                }
              } else {
                findings.push(
                  protectionFinding("Configured Ruleset record has no integer Ruleset ID."),
                );
              }

              if (!liveRuleset) return findings;

              requireProtection(
                liveRuleset.id === expectedRuleset.id &&
                  liveRuleset.name === expectedRuleset.name,
                "Live Ruleset identity does not match the configured record.",
              );
              requireProtection(
                liveRuleset.target === "branch" &&
                  liveRuleset.source_type === "Repository" &&
                  liveRuleset.source === repositoryFullName,
                "Live Ruleset target or repository source drifted.",
              );
              requireProtection(
                liveRuleset.enforcement === "active",
                `Live Ruleset enforcement is ` +
                  `${liveRuleset.enforcement ?? "<missing>"}, not active.`,
              );
              requireProtection(
                Array.isArray(liveRuleset.bypass_actors) &&
                  liveRuleset.bypass_actors.length === 0 &&
                  liveRuleset.current_user_can_bypass === "never",
                "Live Ruleset has a bypass actor or current-user bypass.",
              );
              requireProtection(
                jsonEqual(
                  sortedStrings(liveRuleset.conditions?.ref_name?.include),
                  sortedStrings(expectedRuleset.conditions?.refName?.include),
                ) &&
                  jsonEqual(
                    sortedStrings(liveRuleset.conditions?.ref_name?.exclude),
                    sortedStrings(expectedRuleset.conditions?.refName?.exclude),
                  ),
                "Live Ruleset branch target conditions drifted from the record.",
              );

              const liveRules = Array.isArray(liveRuleset.rules)
                ? liveRuleset.rules
                : [];
              const liveRule = (type) =>
                liveRules.find((rule) => rule.type === type);
              requireProtection(
                jsonEqual(
                  liveRules.map((rule) => rule.type).sort(),
                  expectedRules.map((rule) => rule.type).sort(),
                ),
                "Live Ruleset rule types drifted from the configured record.",
              );

              const expectedPullRequest = expectedRule("pull_request")?.parameters;
              const livePullRequest = liveRule("pull_request")?.parameters;
              requireProtection(
                Boolean(livePullRequest) &&
                  livePullRequest.required_approving_review_count ===
                    expectedPullRequest?.requiredApprovingReviewCount &&
                  livePullRequest.dismiss_stale_reviews_on_push ===
                    expectedPullRequest?.dismissStaleReviewsOnPush &&
                  livePullRequest.require_code_owner_review ===
                    expectedPullRequest?.requireCodeOwnerReview &&
                  livePullRequest.require_last_push_approval ===
                    expectedPullRequest?.requireLastPushApproval &&
                  livePullRequest.required_review_thread_resolution ===
                    expectedPullRequest?.requiredReviewThreadResolution &&
                  jsonEqual(
                    sortedStrings(livePullRequest.allowed_merge_methods),
                    sortedStrings(expectedPullRequest?.allowedMergeMethods),
                  ),
                "Live pull-request Ruleset parameters drifted from the record.",
              );

              const expectedStatus = expectedRule("required_status_checks")?.parameters;
              const liveStatus = liveRule("required_status_checks")?.parameters;
              const normalizeChecks = (checks, integrationKey) =>
                Array.isArray(checks)
                  ? checks
                      .map((check) => ({
                        context: check.context,
                        integrationId: check[integrationKey],
                      }))
                      .sort((left, right) =>
                        `${left.context}:${left.integrationId}`.localeCompare(
                          `${right.context}:${right.integrationId}`,
                        ),
                      )
                  : checks;
              requireProtection(
                Boolean(liveStatus) &&
                  liveStatus.strict_required_status_checks_policy ===
                    expectedStatus?.strictRequiredStatusChecksPolicy &&
                  liveStatus.do_not_enforce_on_create ===
                    expectedStatus?.doNotEnforceOnCreate &&
                  jsonEqual(
                    normalizeChecks(
                      liveStatus.required_status_checks,
                      "integration_id",
                    ),
                    normalizeChecks(
                      expectedStatus?.requiredStatusChecks,
                      "integrationId",
                    ),
                  ),
                "Live required-status Ruleset parameters drifted from the record.",
              );

              return findings;
            };

            const readRepositoryState = async () => {
              const [{ data: repository }, branches, openPullRequests] =
                await Promise.all([
                  github.rest.repos.get({ owner, repo }),
                  github.paginate(github.rest.repos.listBranches, {
                    owner,
                    repo,
                    per_page: 100,
                  }),
                  github.paginate(github.rest.pulls.list, {
                    owner,
                    repo,
                    state: "open",
                    per_page: 100,
                  }),
                ]);
              return { repository, branches, openPullRequests };
            };

            let state = await readRepositoryState();
            const protectionFindings = await auditMainProtection(state.repository);
            const protectionBlocked = protectionFindings.some(
              (finding) => finding.severity === "error",
            );
            const cleanupCandidates = protectionBlocked
              ? []
              : selectAllowlistedLegacyHelperBranches({
                  defaultBranch: state.repository.default_branch,
                  branches: state.branches,
                  openPullRequests: state.openPullRequests,
                  cleanupEntries: reconciliation.legacyBranches,
                });
            if (protectionBlocked) {
              core.warning(
                "Main protection could not be verified; branch cleanup is disabled for this run.",
              );
            }

            const cleanupFailures = [];
            const deleted = [];
            for (const candidate of cleanupCandidates) {
              try {
                const [
                  { data: latestRepository },
                  { data: latestBranch },
                  currentlyOpenPullRequests,
                ] = await Promise.all([
                  github.rest.repos.get({ owner, repo }),
                  github.rest.repos.getBranch({
                    owner,
                    repo,
                    branch: candidate.name,
                  }),
                  github.paginate(github.rest.pulls.list, {
                    owner,
                    repo,
                    state: "open",
                    head: `${owner}:${candidate.name}`,
                    per_page: 100,
                  }),
                ]);

                if (candidate.name === latestRepository.default_branch) {
                  cleanupFailures.push(`${candidate.name}: became default branch`);
                  continue;
                }
                if (currentlyOpenPullRequests.length > 0) {
                  cleanupFailures.push(`${candidate.name}: acquired an open PR`);
                  continue;
                }
                if (latestBranch.protected === true) {
                  cleanupFailures.push(`${candidate.name}: became protected`);
                  continue;
                }
                if (latestBranch.commit.sha !== candidate.headSha) {
                  cleanupFailures.push(
                    `${candidate.name}: HEAD moved from ${candidate.headSha} ` +
                      `to ${latestBranch.commit.sha}`,
                  );
                  continue;
                }

                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${candidate.name}`,
                });
                deleted.push(candidate);
                core.notice(
                  `Deleted allowlisted legacy helper branch ${candidate.name} ` +
                    `at ${candidate.headSha}; recovery: recreate the ref at that SHA.`,
                );
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Legacy helper branch ${candidate.name} is already absent.`);
                  continue;
                }
                cleanupFailures.push(
                  `${candidate.name}: ${error.message ?? String(error)}`,
                );
              }
            }

            state = await readRepositoryState();
            const allowedOrphanBranches = [];
            for (const entry of reconciliation.legacyBranches ?? []) {
              if (entry.action !== "preserve-snapshot") continue;
              const branch = state.branches.find(
                (candidate) => candidate.name === entry.branch,
              );
              if (!branch) continue;
              if (branch.commit.sha !== entry.expectedHead) {
                cleanupFailures.push(
                  `${entry.branch}: preserved snapshot HEAD moved from ` +
                    `${entry.expectedHead} to ${branch.commit.sha}`,
                );
                continue;
              }
              allowedOrphanBranches.push(entry.branch);
            }

            const findings = [
              ...protectionFindings,
              ...auditRepositoryWorkItems({
                defaultBranch: state.repository.default_branch,
                branches: state.branches,
                openPullRequests: state.openPullRequests,
                allowedOrphanBranches,
                maxOpenPrimaryPullRequests:
                  config.workItemLifecycle.maxOpenPrimaryPullRequests,
              }),
            ];

            for (const pullRequest of state.openPullRequests) {
              for (const violation of validatePullRequestWorkItemContract({
                body: pullRequest.body ?? "",
                title: pullRequest.title ?? "",
                headRef: pullRequest.head.ref,
                prNumber: pullRequest.number,
              })) {
                findings.push({
                  kind: "open-pr-contract",
                  severity: "error",
                  pullRequest: pullRequest.number,
                  message: `Open PR #${pullRequest.number}: ${violation}`,
                });
              }

              const metadata = parseHarnessMetadata(pullRequest.body ?? "");
              if (!metadata) continue;
              const workItem = parseNumberReference(metadata["work-item"]);
              const ownerInput = parseNumberReference(metadata["owner-input"], {
                allowNone: true,
              });
              const supersedesPr = parseNumberReference(
                metadata["supersedes-pr"],
                { allowNone: true },
              );

              if (Number.isInteger(workItem)) {
                try {
                  const { data } = await github.rest.issues.get({
                    owner,
                    repo,
                    issue_number: workItem,
                  });
                  if (data.pull_request) {
                    findings.push({
                      kind: "work-item-is-pr",
                      severity: "error",
                      message:
                        `Open PR #${pullRequest.number} work-item #${workItem} ` +
                        `resolves to a Pull Request, not an Issue.`,
                    });
                  }
                } catch (error) {
                  findings.push({
                    kind: "work-item-unreadable",
                    severity: "error",
                    message:
                      `Open PR #${pullRequest.number} work-item #${workItem} ` +
                      `cannot be verified: ${error.message ?? String(error)}`,
                  });
                }
              }

              if (Number.isInteger(ownerInput)) {
                try {
                  const { data } = await github.rest.issues.get({
                    owner,
                    repo,
                    issue_number: ownerInput,
                  });
                  if (data.pull_request) {
                    findings.push({
                      kind: "owner-input-is-pr",
                      severity: "error",
                      message:
                        `Open PR #${pullRequest.number} owner-input #${ownerInput} ` +
                        `resolves to a Pull Request.`,
                    });
                  } else if (data.user?.login !== owner) {
                    findings.push({
                      kind: "owner-input-author",
                      severity: "error",
                      message:
                        `Open PR #${pullRequest.number} owner-input #${ownerInput} ` +
                        `was not authored by repository owner ${owner}.`,
                    });
                  }
                } catch (error) {
                  findings.push({
                    kind: "owner-input-unreadable",
                    severity: "error",
                    message:
                      `Open PR #${pullRequest.number} owner-input #${ownerInput} ` +
                      `cannot be verified: ${error.message ?? String(error)}`,
                  });
                }
              }

              if (Number.isInteger(supersedesPr)) {
                try {
                  await github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: supersedesPr,
                  });
                } catch (error) {
                  findings.push({
                    kind: "supersedes-pr-unreadable",
                    severity: "error",
                    message:
                      `Open PR #${pullRequest.number} supersedes-pr #${supersedesPr} ` +
                      `cannot be verified as a Pull Request: ` +
                      `${error.message ?? String(error)}`,
                  });
                }
              }
            }

            await core.summary
              .addHeading("Repository Hygiene")
              .addRaw(`Deleted legacy helper branches: ${deleted.length}\n`)
              .addRaw(
                `Preserved registered snapshots: ` +
                  `${allowedOrphanBranches.join(", ") || "none"}\n`,
              )
              .addRaw(`Policy findings: ${findings.length}\n`)
              .write();

            const failures = [
              ...cleanupFailures,
              ...findings
                .filter((finding) => finding.severity === "error")
                .map((finding) => finding.message),
            ];
            if (failures.length > 0) {
              core.setFailed(
                `Repository hygiene found ${failures.length} blocking condition(s): ` +
                  failures.join("; "),
              );
            }
