name: AI apply isolated repair

on:
  push:
    branches:
      - spike/m0-pi-cancel-retry-exhaustion

permissions:
  contents: write

jobs:
  patch-capture-trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: spike/m0-pi-cancel-retry-exhaustion
          persist-credentials: true
          fetch-depth: 0

      - name: Apply deterministic partial-stream trigger repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/probes/pi-cancel-retry-exhaustion-capture.mjs")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global source
              matches = source.count(old)
              if matches != 1:
                  raise SystemExit(
                      f"expected exactly one repair target, found {matches}: {old[:100]!r}"
                  )
              source = source.replace(old, new, 1)

          replace_once(
              '    tokensPerSecond: 10_000,\n',
              '    tokensPerSecond: 128,\n',
          )
          replace_once(
              '''    onPublicEvent: ({ event, record }) => {
                if (!updateSeen && event.type === "message_update" && event.message?.role === "assistant") {
                  updateSeen = true;
                  resolveUpdate(record.sequence);
                }
              },
          ''',
              '''    onPublicEvent: ({ event, record }) => {
                const partialText = textFromContent(event.message?.content);
                if (
                  !updateSeen &&
                  event.type === "message_update" &&
                  event.message?.role === "assistant" &&
                  partialText !== undefined &&
                  partialText.length < ACTIVE_ABORT_RESPONSE.length
                ) {
                  updateSeen = true;
                  resolveUpdate({
                    sequence: record.sequence,
                    messageTextLength: partialText.length,
                    messageTextSha256: sha256(partialText),
                  });
                }
              },
          ''',
          )
          replace_once(
              '  const triggerSequence = await withTimeout(sawUpdate, 5_000, "active-stream-abort message_update");\n',
              '  const trigger = await withTimeout(sawUpdate, 5_000, "active-stream-abort partial message_update");\n',
          )
          replace_once(
              '''    triggerEvent: "message_update",
              triggerSequence,
              outcome: abortOutcome,
          ''',
              '''    triggerEvent: "message_update",
              triggerSequence: trigger.sequence,
              triggerMessageTextLength: trigger.messageTextLength,
              triggerMessageTextSha256: trigger.messageTextSha256,
              outcome: abortOutcome,
          ''',
          )

          path.write_text(source, encoding="utf-8")
          PY
          node --check scripts/probes/pi-cancel-retry-exhaustion-capture.mjs
          git diff --check
          git diff -- scripts/probes/pi-cancel-retry-exhaustion-capture.mjs

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git add scripts/probes/pi-cancel-retry-exhaustion-capture.mjs
          if git diff --cached --quiet; then
            echo "No repair changes were produced."
            exit 0
          fi
          git commit -m "fix(spike): abort after a partial streaming update"
          git push origin HEAD:spike/m0-pi-cancel-retry-exhaustion
