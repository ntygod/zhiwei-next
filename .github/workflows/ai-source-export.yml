name: AI apply Compaction finalization

on:
  push:
    branches:
      - spike/m0-pi-compaction-session-replacement
    paths:
      - .github/ai-finalize-v2-trigger

permissions:
  contents: write

jobs:
  apply-finalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout finalization branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: spike/m0-pi-compaction-session-replacement
          persist-credentials: true
          fetch-depth: 0

      - name: Apply verified finalization payload
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/compaction-final-v2.tgz"
          cat .github/ai-payload/compaction-final-v2-*.b64 | base64 --decode > "$PAYLOAD"
          echo "11bbd630fa6121b5c307c091d9fc42d3dc2083022129406d4a48d9a7c3a4c7f5  $PAYLOAD" | sha256sum --check --strict

          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          package.json
          packages/pi-adapter/fixtures/pi-lifecycle-compaction-session-replacement.json
          scripts/check-pi-compaction-session-replacement-result.mjs
          docs/spikes/pi-runtime-contract/compaction-session-replacement-lifecycle.md
          docs/spikes/pi-runtime-contract/README.md
          docs/architecture/pi-integration.md
          docs/harness/project-state.md
          EOF
          tar -tzf "$PAYLOAD" > "$RUNNER_TEMP/archive-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/archive-files.txt"
          tar -xzf "$PAYLOAD"

          rm -rf .github/ai-payload
          rm -f .github/ai-finalize-v2-trigger
          rm -f .github/ai-source-export-trigger

          node --check scripts/probes/pi-compaction-session-replacement-capture.mjs
          node --check scripts/check-pi-compaction-session-replacement-result.mjs
          npm run check
          git diff --check

      - name: Commit verified finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git add \
            package.json \
            packages/pi-adapter/fixtures/pi-lifecycle-compaction-session-replacement.json \
            scripts/check-pi-compaction-session-replacement-result.mjs \
            docs/spikes/pi-runtime-contract/compaction-session-replacement-lifecycle.md \
            docs/spikes/pi-runtime-contract/README.md \
            docs/architecture/pi-integration.md \
            docs/harness/project-state.md
          git add -u .github/ai-payload .github/ai-finalize-v2-trigger .github/ai-source-export-trigger
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "Finalization must not stage workflow mutations."
            exit 1
          fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Finalization payload produced no changes."
            exit 1
          fi
          git commit -m "feat(spike): freeze Compaction and Session Replacement contract"
          git push origin HEAD:spike/m0-pi-compaction-session-replacement
