name: AI apply Compaction initial implementation

on:
  push:
    branches:
      - spike/m0-pi-compaction-session-replacement
    paths:
      - .github/ai-initial-trigger

permissions:
  contents: write

jobs:
  apply-initial-implementation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: spike/m0-pi-compaction-session-replacement
          persist-credentials: true
          fetch-depth: 0

      - name: Apply verified implementation payload
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/compaction-initial.tgz"
          cat .github/ai-payload/compaction-initial-*.b64 | base64 --decode > "$PAYLOAD"
          echo "37563073d580df12964c89c114a1f83e76c5717e65081eef54e50df1583efbda  $PAYLOAD" | sha256sum --check --strict

          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          scripts/probes/pi-compaction-session-replacement-capture.mjs
          scripts/check-pi-compaction-session-replacement-result.mjs
          .github/workflows/pi-compaction-session-replacement.yml
          EOF
          tar -tzf "$PAYLOAD" > "$RUNNER_TEMP/archive-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/archive-files.txt"
          tar -xzf "$PAYLOAD"

          rm -rf .github/ai-payload
          rm -f .github/ai-initial-trigger
          rm -f .github/workflows/ai-source-export.yml

          node --check scripts/probes/pi-compaction-session-replacement-capture.mjs
          node --check scripts/check-pi-compaction-session-replacement-result.mjs
          npm run check
          git diff --check
          git status --short

      - name: Commit initial implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git add \
            scripts/probes/pi-compaction-session-replacement-capture.mjs \
            scripts/check-pi-compaction-session-replacement-result.mjs \
            .github/workflows/pi-compaction-session-replacement.yml
          git add -u .github/ai-payload .github/ai-initial-trigger .github/workflows/ai-source-export.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Implementation payload produced no changes."
            exit 1
          fi
          git commit -m "spike(m0): add Pi Compaction and Session Replacement capture"
          git push origin HEAD:spike/m0-pi-compaction-session-replacement
