name: Main Provenance Dispatch

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: read
  issues: write

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch provenance after an autonomous merge
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const defaultBranch = context.payload.repository.default_branch;
            const repositoryFullName = `${owner}/${repo}`;

            if (run.head_repository?.full_name !== repositoryFullName) {
              core.setFailed(
                `Refusing provenance dispatch for CI source ` +
                  `${run.head_repository?.full_name ?? "<missing>"}; ` +
                  `expected ${repositoryFullName}.`,
              );
              return;
            }
            if (run.name !== "CI" || run.path !== ".github/workflows/ci.yml") {
              core.setFailed("Refusing provenance dispatch for a non-canonical CI workflow identity.");
              return;
            }
            const ciIdentityPattern =
              /^ci \| event=pull_request \| pr=([1-9][0-9]*) \| action=(opened|synchronize|reopened|ready_for_review|edited) \| updated_at=([^ |]+) \| ready=(true|false) \| base=([0-9a-f]{40}) \| head=([0-9a-f]{40}) \| run=([1-9][0-9]*)$/;
            const ciIdentity = ciIdentityPattern.exec(run.display_title ?? "");
            if (!ciIdentity) {
              core.setFailed("Successful CI run is missing the exact machine event identity.");
              return;
            }
            const [
              ,
              pullNumberText,
              ciAction,
              ciUpdatedAt,
              ciReady,
              testedBaseSha,
              ciHeadSha,
              ciRunId,
            ] = ciIdentity;
            const pullNumber = Number(pullNumberText);
            if (ciReady === "false") {
              core.info("Draft pull request CI completed; no provenance dispatch is required.");
              return;
            }
            if (
              !Number.isSafeInteger(pullNumber) ||
              ciReady !== "true" ||
              ciHeadSha !== run.head_sha ||
              ciRunId !== String(run.id) ||
              !Number.isFinite(Date.parse(ciUpdatedAt))
            ) {
              core.setFailed("Successful CI run does not describe a Ready pull request event exactly.");
              return;
            }

            function parseBlock(text, marker) {
              const source = text ?? "";
              const markerIndex = source.lastIndexOf(marker);
              if (markerIndex < 0) return undefined;
              const commentStart = source.lastIndexOf("<!--", markerIndex);
              const commentEnd = source.indexOf("-->", markerIndex + marker.length);
              if (commentStart < 0 || commentEnd < 0 || commentStart > markerIndex) return undefined;
              const result = {};
              for (const rawLine of source.slice(markerIndex + marker.length, commentEnd).split(/\r?\n/)) {
                const line = rawLine.trim();
                const separator = line.indexOf(":");
                if (separator <= 0) continue;
                result[line.slice(0, separator).trim()] = line.slice(separator + 1).trim();
              }
              return result;
            }

            async function failClosed({ pullNumber, before, after, reason, detail }) {
              const openIssues = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: "open",
                per_page: 100,
              });
              let incident = openIssues.find((issue) => {
                const record = parseBlock(issue.body, "zhiwei-main-incident");
                return record?.status === "open" && record?.after === after;
              });
              const body = `## 自动合并后的 provenance 审计链失败\n\n` +
                `PR #${pullNumber} 已合并，但无法建立可信的 Main Provenance 审计事件。\n\n` +
                `- before: \`${before}\`\n` +
                `- after: \`${after}\`\n` +
                `- reason: \`${reason}\`\n` +
                `- detail: \`${String(detail ?? "").slice(0, 500)}\`\n` +
                `- CI workflow run: ${run.html_url}\n` +
                `- dispatch workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\n\n` +
                `该更新来自已合并 PR，但 provenance 链不完整，因此按 fail-closed 方式进入 Main Incident 安全停机。\n\n` +
                `<!--\nzhiwei-main-incident\nstatus: open\nkind: unauthorized-main-write\nreason: ${reason}\nbefore: ${before}\nafter: ${after}\n-->`;
              if (!incident) {
                ({ data: incident } = await github.rest.issues.create({
                  owner,
                  repo,
                  title: `incident(r3): provenance chain failed for ${after.slice(0, 12)}`,
                  body,
                }));
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: incident.number,
                  body: `Main Provenance dispatch retry failed again.\n\n- reason: \`${reason}\`\n- run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                });
              }
              core.setFailed(`Merged PR #${pullNumber}, but Main Provenance failed closed. Incident #${incident.number}: ${reason}.`);
            }

            let pr;
            for (let attempt = 0; attempt < 45; attempt += 1) {
              ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber }));
              if (pr.merged_at && pr.merge_commit_sha) break;
              if (pr.state === "closed") {
                core.info(`PR #${pullNumber} closed without merge; no provenance dispatch.`);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }

            if (!pr?.merged_at || !pr.merge_commit_sha) {
              core.info(`PR #${pullNumber} was not merged during the provenance observation window.`);
              return;
            }
            if (pr.base.ref !== defaultBranch) {
              core.info(`PR #${pullNumber} targets ${pr.base.ref}, not ${defaultBranch}; no provenance dispatch.`);
              return;
            }

            const after = pr.merge_commit_sha;
            let ciRuns;
            try {
              ({ data: ciRuns } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: run.workflow_id,
                event: "pull_request",
                head_sha: run.head_sha,
                per_page: 100,
              }));
            } catch (error) {
              await failClosed({
                pullNumber,
                before: testedBaseSha,
                after,
                reason: "successful-ci-run-selection-unavailable",
                detail: error.message,
              });
              return;
            }
            const successfulReadyRuns = (ciRuns.workflow_runs ?? [])
              .filter((candidateRun) => {
                const candidateIdentity = ciIdentityPattern.exec(
                  candidateRun.display_title ?? "",
                );
                return (
                  candidateRun.status === "completed" &&
                  candidateRun.conclusion === "success" &&
                  candidateRun.event === "pull_request" &&
                  candidateRun.workflow_id === run.workflow_id &&
                  candidateRun.path === run.path &&
                  candidateRun.name === run.name &&
                  candidateRun.head_sha === run.head_sha &&
                  candidateRun.head_branch === run.head_branch &&
                  candidateRun.head_repository?.full_name === repositoryFullName &&
                  candidateIdentity?.[1] === pullNumberText &&
                  candidateIdentity?.[4] === "true" &&
                  candidateIdentity?.[5] === testedBaseSha &&
                  candidateIdentity?.[6] === run.head_sha &&
                  candidateIdentity?.[7] === String(candidateRun.id)
                );
              })
              .sort((left, right) => {
                const createdDifference =
                  Date.parse(right.created_at ?? "") - Date.parse(left.created_at ?? "");
                return createdDifference || right.id - left.id;
              });
            if (!successfulReadyRuns.some((candidateRun) => candidateRun.id === run.id)) {
              await failClosed({
                pullNumber,
                before: testedBaseSha,
                after,
                reason: "successful-ci-run-selection-mismatch",
                detail: `completed run ${run.id} was absent from its exact successful Ready set`,
              });
              return;
            }
            if (successfulReadyRuns[0]?.id !== run.id) {
              core.info(
                `CI run ${run.id} is not the latest successful Ready run for PR #${pullNumber}; ` +
                  "provenance dispatch is left to the latest run.",
              );
              return;
            }
            if (pr.head.sha !== run.head_sha) {
              await failClosed({
                pullNumber,
                before: testedBaseSha,
                after,
                reason: "successful-ci-head-mismatch",
                detail: `merged head ${pr.head.sha} differs from CI head ${run.head_sha}`,
              });
              return;
            }
            if (pr.base.sha !== testedBaseSha) {
              await failClosed({
                pullNumber,
                before: testedBaseSha,
                after,
                reason: "successful-ci-base-mismatch",
                detail: `merged base ${pr.base.sha} differs from CI base ${testedBaseSha}`,
              });
              return;
            }

            const { data: mergeCommit } = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: after,
            });
            const parents = mergeCommit.parents ?? [];
            if (parents.length !== 1 || parents[0].sha !== testedBaseSha) {
              await failClosed({
                pullNumber,
                before: testedBaseSha,
                after,
                reason: "squash-parent-contract-mismatch",
                detail: `parents=${parents.map((parent) => parent.sha).join(",") || "<none>"}`,
              });
              return;
            }

            try {
              await github.rest.repos.createDispatchEvent({
                owner,
                repo,
                event_type: "main-provenance",
                client_payload: {
                  before: testedBaseSha,
                  after,
                  default_branch: defaultBranch,
                  pull_number: pullNumber,
                  source: "autonomous-merge",
                },
              });
              core.notice(`Dispatched Main Provenance for PR #${pullNumber} at ${after}.`);
            } catch (error) {
              await failClosed({
                pullNumber,
                before: testedBaseSha,
                after,
                reason: "provenance-dispatch-failed",
                detail: error.message ?? error,
              });
            }
