name: Autonomous Merge
run-name: autonomous-merge | source_ci_run=${{ github.event.workflow_run.id }} | source_ci_attempt=${{ github.event.workflow_run.run_attempt }} | source_ci_head=${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge eligible pull request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const defaultBranch = context.payload.repository.default_branch;
            const repositoryFullName = `${owner}/${repo}`;

            if (run.head_repository?.full_name !== repositoryFullName) {
              core.warning(
                `Refusing autonomous merge for CI source ` +
                  `${run.head_repository?.full_name ?? "<missing>"}; ` +
                  `expected ${repositoryFullName}.`,
              );
              return;
            }
            if (run.path !== ".github/workflows/ci.yml") {
              core.warning("Refusing autonomous merge for a non-canonical CI workflow identity.");
              return;
            }
            const ciIdentityPattern =
              /^ci \| event=pull_request \| pr=([1-9][0-9]*) \| action=(opened|synchronize|reopened|ready_for_review|edited) \| updated_at=([^ |]+) \| ready=(true|false) \| base=([0-9a-f]{40}) \| head=([0-9a-f]{40}) \| run=([1-9][0-9]*)$/;
            const ciIdentity = ciIdentityPattern.exec(run.display_title ?? "");
            if (!ciIdentity) {
              core.warning("Successful CI run is missing the exact machine event identity.");
              return;
            }

            const [
              ,
              pullNumberText,
              ciAction,
              ciUpdatedAt,
              ciReady,
              testedBaseSha,
              ciHeadSha,
              ciRunId,
            ] = ciIdentity;
            const pullNumber = Number(pullNumberText);
            if (
              !Number.isSafeInteger(pullNumber) ||
              ciReady !== "true" ||
              ciHeadSha !== run.head_sha ||
              ciRunId !== String(run.id) ||
              !Number.isFinite(Date.parse(ciUpdatedAt))
            ) {
              core.info("Successful CI run does not describe a Ready pull request event exactly.");
              return;
            }

            let pr;
            for (let attempt = 0; attempt < 5; attempt += 1) {
              ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber }));
              if (pr.mergeable !== null) break;
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }

            core.info(`Evaluating PR #${pullNumber}: head=${pr.head.sha}, base=${pr.base.sha}, bodyLength=${(pr.body ?? "").length}.`);

            if (pr.head.repo?.full_name !== repositoryFullName) {
              core.warning(
                `Refusing autonomous merge for PR #${pullNumber} from ` +
                  `${pr.head.repo?.full_name ?? "<missing>"}; ` +
                  `expected ${repositoryFullName}.`,
              );
              return;
            }
            if (pr.state !== "open" || pr.draft) {
              core.info("Pull request is closed or still draft; autonomous merge is skipped.");
              return;
            }
            const expectedCiDisplayTitle =
              `ci | event=pull_request | pr=${pullNumber} | action=${ciAction} | ` +
              `updated_at=${pr.updated_at} | ready=true | base=${pr.base.sha} | ` +
              `head=${pr.head.sha} | run=${run.id}`;
            if (run.display_title !== expectedCiDisplayTitle) {
              core.info(
                "Pull request event identity changed after the successful CI run; a fresh run is required.",
              );
              return;
            }
            if (pr.base.ref !== defaultBranch) {
              core.info(`Pull request targets ${pr.base.ref}, not the default branch.`);
              return;
            }
            if (pr.base.sha !== testedBaseSha) {
              core.info("Default branch moved after the successful CI run; a fresh CI run is required.");
              return;
            }
            if (pr.head.sha !== run.head_sha) {
              core.info("Pull request HEAD moved after the successful CI run; waiting for the new run.");
              return;
            }
            if (pr.mergeable !== true) {
              core.info(`Pull request is not currently mergeable: ${pr.mergeable_state ?? "unknown"}.`);
              return;
            }

            function parseBlock(text, marker) {
              const source = text ?? "";
              const markerIndex = source.lastIndexOf(marker);
              if (markerIndex < 0) return undefined;
              const commentStart = source.lastIndexOf("<!--", markerIndex);
              const commentEnd = source.indexOf("-->", markerIndex + marker.length);
              if (commentStart < 0 || commentEnd < 0 || commentStart > markerIndex) return undefined;

              const result = {};
              const block = source.slice(markerIndex + marker.length, commentEnd);
              for (const rawLine of block.split(/\r?\n/)) {
                const line = rawLine.trim();
                const separator = line.indexOf(":");
                if (separator <= 0) continue;
                result[line.slice(0, separator).trim()] = line.slice(separator + 1).trim();
              }
              return result;
            }

            async function failPostMergeClosed({ before, after, reason, detail }) {
              const openIssues = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: "open",
                per_page: 100,
              });
              let incident = openIssues.find((issue) => {
                const record = parseBlock(issue.body, "zhiwei-main-incident");
                return record?.status === "open" && record?.after === after;
              });
              const body = `## 自动合并后的 provenance 审计链失败\n\n` +
                `PR #${pullNumber} 已由 Autonomous Merge 合并，但无法确认可信的 Main Provenance 审计事件。\n\n` +
                `- before: \`${before}\`\n` +
                `- after: \`${after}\`\n` +
                `- reason: \`${reason}\`\n` +
                `- detail: \`${String(detail ?? "").slice(0, 500)}\`\n` +
                `- source CI workflow run: ${run.html_url}\n` +
                `- Autonomous Merge workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\n\n` +
                `该更新来自已合并 PR，但 provenance 链不完整，因此按 fail-closed 方式进入 Main Incident 安全停机。\n\n` +
                `<!--\nzhiwei-main-incident\nstatus: open\nkind: unauthorized-main-write\nreason: ${reason}\nbefore: ${before}\nafter: ${after}\n-->`;
              if (!incident) {
                ({ data: incident } = await github.rest.issues.create({
                  owner,
                  repo,
                  title: `incident(r3): provenance chain failed for ${after.slice(0, 12)}`,
                  body,
                }));
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: incident.number,
                  body: `Autonomous Merge post-merge provenance failed again.\n\n` +
                    `- reason: \`${reason}\`\n` +
                    `- run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                });
              }
              core.setFailed(
                `Merged PR #${pullNumber}, but Main Provenance failed closed. ` +
                  `Incident #${incident.number}: ${reason}.`,
              );
            }

            async function readTrustedJson(path) {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: defaultBranch,
              });
              if (Array.isArray(data) || data.type !== "file" || typeof data.content !== "string") {
                throw new Error(`Trusted config path is not a file: ${path}`);
              }
              return JSON.parse(Buffer.from(data.content, data.encoding ?? "base64").toString("utf8"));
            }

            const body = pr.body ?? "";
            const requiredHeadings = [
              "## 目标与结果",
              "## 范围与非目标",
              "## 风险与回滚",
              "## 验证证据",
              "## 自主交付记录",
            ];
            const missingHeadings = requiredHeadings.filter((heading) => !body.includes(heading));
            if (missingHeadings.length > 0) {
              core.warning(`PR contract is missing headings: ${missingHeadings.join(", ")}`);
              return;
            }

            const metadata = parseBlock(body, "zhiwei-harness");
            core.info(`Harness metadata for PR #${pullNumber}: autonomous-merge=${metadata?.["autonomous-merge"] ?? "<missing>"}, risk=${metadata?.risk ?? "<missing>"}, independent-review=${metadata?.["independent-review"] ?? "<missing>"}, main-incident-recovery=${metadata?.["main-incident-recovery"] ?? "<missing>"}.`);
            if (!metadata || metadata["autonomous-merge"] !== "yes") {
              core.info("Autonomous merge is not enabled in the PR contract.");
              return;
            }

            const ranks = { R0: 0, R1: 1, R2: 2, R3: 3 };
            function maxRisk(left, right) {
              return ranks[left] >= ranks[right] ? left : right;
            }
            function inferMinimumRisk(files) {
              let risk = "R0";
              for (const path of files) {
                if (
                  path === "SECURITY.md" ||
                  path === "docs/architecture/trust-and-safety.md" ||
                  path.startsWith(".github/workflows/") ||
                  /(?:secret|credential|privacy|deletion|forget)/i.test(path)
                ) {
                  risk = maxRisk(risk, "R3");
                } else if (
                  path === "AGENTS.md" ||
                  path.endsWith("/AGENTS.md") ||
                  path === "harness.config.json" ||
                  path.startsWith("docs/harness/") ||
                  path.startsWith("docs/adr/") ||
                  path.startsWith("packages/domain/") ||
                  path.startsWith("packages/protocol/") ||
                  path.startsWith("packages/memory-store/") ||
                  path === "package.json" ||
                  path === ".github/pull_request_template.md" ||
                  path.startsWith("scripts/check-")
                ) {
                  risk = maxRisk(risk, "R2");
                } else if (
                  path.startsWith("apps/") ||
                  path.startsWith("packages/") ||
                  /\.(?:ts|tsx|js|jsx|mjs|cjs|json|yml|yaml)$/.test(path)
                ) {
                  risk = maxRisk(risk, "R1");
                }
              }
              return risk;
            }
            function governanceChange(files) {
              return files.some((path) =>
                path === "AGENTS.md" ||
                path.endsWith("/AGENTS.md") ||
                path === "harness.config.json" ||
                path.startsWith("docs/harness/") ||
                path === ".github/pull_request_template.md" ||
                path.startsWith(".github/workflows/") ||
                path === "scripts/check-agents.mjs" ||
                path === "scripts/check-harness.mjs" ||
                path === "scripts/check-pr-contract.mjs" ||
                path === "scripts/check-main-provenance.mjs"
              );
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const filenames = files.map((file) => file.filename);
            const minimumRisk = inferMinimumRisk(filenames);
            const declaredRisk = metadata.risk;

            if (!(declaredRisk in ranks) || ranks[declaredRisk] < ranks[minimumRisk]) {
              core.warning(`Risk declaration ${declaredRisk} is below minimum ${minimumRisk}.`);
              return;
            }
            if (!new Set(["yes", "no"]).has(metadata["governance-change"])) {
              core.warning("governance-change must be yes or no.");
              return;
            }
            if (!new Set(["updated", "not-needed"]).has(metadata["project-state"])) {
              core.warning("project-state must be updated or not-needed.");
              return;
            }
            if (!new Set(["provided", "not-required"]).has(metadata.rollback)) {
              core.warning("rollback must be provided or not-required.");
              return;
            }
            if (!new Set(["yes", "no"]).has(metadata["main-incident-recovery"])) {
              core.warning("main-incident-recovery must be yes or no.");
              return;
            }
            if (governanceChange(filenames) && metadata["governance-change"] !== "yes") {
              core.warning("Governance files changed without governance-change: yes.");
              return;
            }
            if (ranks[declaredRisk] >= ranks.R2 && metadata.rollback !== "provided") {
              core.warning(`${declaredRisk} requires rollback: provided.`);
              return;
            }
            if (
              ranks[declaredRisk] >= ranks.R2 &&
              metadata["independent-review"] !== "complete"
            ) {
              core.info(`${declaredRisk} requires independent-review: complete.`);
              return;
            }
            if (
              ranks[declaredRisk] < ranks.R2 &&
              !new Set(["not-required", "complete"]).has(metadata["independent-review"])
            ) {
              core.warning("Low-risk independent-review must be not-required or complete.");
              return;
            }

            let harnessConfig;
            try {
              harnessConfig = await readTrustedJson("harness.config.json");
            } catch (error) {
              core.warning(`Unable to read trusted default-branch Harness config: ${error.message}`);
              return;
            }

            const configuredPause = harnessConfig.developmentPause?.active === true;
            const configuredIncidentIssue = Number.isInteger(harnessConfig.developmentPause?.incidentIssue)
              ? harnessConfig.developmentPause.incidentIssue
              : undefined;
            const configuredRecoveryValue = harnessConfig.developmentPause?.allowedPullRequestMetadata?.["main-incident-recovery"];
            if (configuredPause && configuredRecoveryValue !== "yes") {
              core.warning("Trusted Harness config has an unsupported development-pause recovery contract.");
              return;
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const activeMainIncidents = openIssues.filter((issue) => {
              const record = parseBlock(issue.body, "zhiwei-main-incident");
              return record?.status === "open" && record?.kind === "unauthorized-main-write";
            });
            const requiredIncidentNumbers = new Set(activeMainIncidents.map((issue) => issue.number));
            if (configuredPause && configuredIncidentIssue) {
              requiredIncidentNumbers.add(configuredIncidentIssue);
            }

            const recoveryRequired = configuredPause || activeMainIncidents.length > 0;
            if (recoveryRequired) {
              if (metadata["main-incident-recovery"] !== "yes") {
                const sources = [
                  configuredPause ? `trusted config pause (${harnessConfig.developmentPause.reason ?? "unspecified"})` : undefined,
                  ...activeMainIncidents.map((issue) => `incident #${issue.number}`),
                ].filter(Boolean);
                core.info(`Active main safety halt blocks autonomous merge: ${sources.join(", ")}.`);
                return;
              }
              if (declaredRisk !== "R3" || metadata["governance-change"] !== "yes") {
                core.warning("A main incident recovery PR must declare R3 and governance-change: yes.");
                return;
              }
              const missingIncidentReferences = [...requiredIncidentNumbers].filter((issueNumber) =>
                !new RegExp(`(?:Addresses|Closes|Fixes)\\s+#${issueNumber}\\b`, "i").test(body)
              );
              if (missingIncidentReferences.length > 0) {
                core.warning(`Recovery PR must reference every required main incident: ${missingIncidentReferences.map((issueNumber) => `#${issueNumber}`).join(", ")}.`);
                return;
              }
            } else if (metadata["main-incident-recovery"] === "yes") {
              core.warning("main-incident-recovery: yes cannot be used when no trusted pause or active main incident exists.");
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const trustedAssociations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            const reviewRecords = comments
              .map((comment) => ({
                comment,
                record: parseBlock(comment.body, "zhiwei-independent-review"),
              }))
              .filter(({ record }) => Boolean(record))
              .filter(({ comment }) => trustedAssociations.has(comment.author_association))
              .filter(({ record }) => record.head === pr.head.sha);

            if (reviewRecords.some(({ record }) => record.verdict === "blocked")) {
              core.info("A trusted current-head independent review blocks this PR.");
              return;
            }
            if (
              ranks[declaredRisk] >= ranks.R2 &&
              !reviewRecords.some(({ record }) =>
                record.verdict === "approved" && Boolean(record.reviewer)
              )
            ) {
              core.info(`${declaredRisk} requires a trusted approved independent AI review for the current HEAD.`);
              return;
            }

            const { data: merge } = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pullNumber,
              sha: pr.head.sha,
              merge_method: "squash",
              commit_title: `${pr.title} (#${pullNumber})`,
            });

            if (!merge.merged) {
              core.setFailed(`GitHub refused the merge: ${merge.message}`);
              return;
            }
            core.notice(`Autonomously merged PR #${pullNumber} at ${merge.sha}.`);

            const after = merge.sha;
            if (!/^[0-9a-f]{40}$/.test(after ?? "")) {
              await failPostMergeClosed({
                before: testedBaseSha,
                after: String(after ?? "missing-merge-sha"),
                reason: "post-merge-confirmation-failed",
                detail: "GitHub reported a successful merge without a full merge commit SHA.",
              });
              return;
            }

            let mergedPr;
            let successfulMergedPrRead = false;
            let lastMergedPrReadError;
            for (let attempt = 0; attempt < 15; attempt += 1) {
              try {
                ({ data: mergedPr } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pullNumber,
                }));
                successfulMergedPrRead = true;
                lastMergedPrReadError = undefined;
                if (mergedPr.merged_at && mergedPr.merge_commit_sha) break;
              } catch (error) {
                lastMergedPrReadError = error;
              }
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }
            if (
              !successfulMergedPrRead ||
              !mergedPr?.merged_at ||
              mergedPr.merge_commit_sha !== after
            ) {
              await failPostMergeClosed({
                before: testedBaseSha,
                after,
                reason: "post-merge-confirmation-failed",
                detail: lastMergedPrReadError
                  ? `GitHub API: ${lastMergedPrReadError.message ?? lastMergedPrReadError}`
                  : `merged_at=${mergedPr?.merged_at ?? "<missing>"}, ` +
                    `merge_commit_sha=${mergedPr?.merge_commit_sha ?? "<missing>"}`,
              });
              return;
            }
            if (mergedPr.head.sha !== run.head_sha || mergedPr.base.sha !== testedBaseSha) {
              await failPostMergeClosed({
                before: testedBaseSha,
                after,
                reason: "post-merge-source-mismatch",
                detail: `head=${mergedPr.head.sha}, expectedHead=${run.head_sha}, ` +
                  `base=${mergedPr.base.sha}, expectedBase=${testedBaseSha}`,
              });
              return;
            }

            let mergeCommit;
            try {
              ({ data: mergeCommit } = await github.rest.git.getCommit({
                owner,
                repo,
                commit_sha: after,
              }));
            } catch (error) {
              await failPostMergeClosed({
                before: testedBaseSha,
                after,
                reason: "post-merge-commit-read-failed",
                detail: error.message ?? error,
              });
              return;
            }
            const parents = mergeCommit.parents ?? [];
            if (parents.length !== 1 || parents[0].sha !== testedBaseSha) {
              await failPostMergeClosed({
                before: testedBaseSha,
                after,
                reason: "squash-parent-contract-mismatch",
                detail: `parents=${parents.map((parent) => parent.sha).join(",") || "<none>"}`,
              });
              return;
            }

            try {
              await github.rest.repos.createDispatchEvent({
                owner,
                repo,
                event_type: "main-provenance",
                client_payload: {
                  before: testedBaseSha,
                  after,
                  default_branch: defaultBranch,
                  pull_number: pullNumber,
                  source: "autonomous-merge",
                },
              });
              core.notice(`Dispatched Main Provenance for PR #${pullNumber} at ${after}.`);
            } catch (error) {
              await failPostMergeClosed({
                before: testedBaseSha,
                after,
                reason: "provenance-dispatch-failed",
                detail: error.message ?? error,
              });
            }
