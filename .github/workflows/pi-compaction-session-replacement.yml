name: Pi Compaction and Session Replacement contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/pi-compaction-session-replacement.yml
      - package.json
      - packages/pi-adapter/fixtures/pi-upstream-baseline.json
      - packages/pi-adapter/fixtures/pi-lifecycle-compaction-session-replacement.json
      - scripts/check-pi-compaction-session-replacement-result.mjs
      - scripts/probes/pi-lifecycle-ci.mjs
      - scripts/probes/pi-compaction-session-replacement-capture.mjs
      - docs/spikes/pi-runtime-contract/README.md
      - docs/spikes/pi-runtime-contract/compaction-session-replacement-lifecycle.md
      - docs/architecture/pi-integration.md
      - docs/harness/project-state.md
  push:
    branches: [main]
    paths:
      - .github/workflows/pi-compaction-session-replacement.yml
      - package.json
      - packages/pi-adapter/fixtures/pi-upstream-baseline.json
      - packages/pi-adapter/fixtures/pi-lifecycle-compaction-session-replacement.json
      - scripts/check-pi-compaction-session-replacement-result.mjs
      - scripts/probes/pi-lifecycle-ci.mjs
      - scripts/probes/pi-compaction-session-replacement-capture.mjs
      - docs/spikes/pi-runtime-contract/README.md
      - docs/spikes/pi-runtime-contract/compaction-session-replacement-lifecycle.md
      - docs/architecture/pi-integration.md
      - docs/harness/project-state.md
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

concurrency:
  group: pi-compaction-session-replacement-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Pi Compaction and Session Replacement lifecycle probe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup exact Node.js runtime for host validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1

      - name: Validate committed checker contract when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f packages/pi-adapter/fixtures/pi-lifecycle-compaction-session-replacement.json ]]; then
            node scripts/check-pi-compaction-session-replacement-result.mjs \
              packages/pi-adapter/fixtures/pi-lifecycle-compaction-session-replacement.json
          else
            echo "Committed Compaction / Session Replacement Fixture is not present yet; Draft probe will generate it."
          fi

      - name: Capture Pi Compaction and Session Replacement lifecycle in sandbox
        env:
          PI_PROBE_IMAGE: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/zhiwei-pi-compaction-session-replacement-bundle"
          RESULT_DIR="$RUNNER_TEMP/zhiwei-pi-compaction-session-replacement-result"
          mkdir -p "$BUNDLE" "$RESULT_DIR"
          tar -cf - \
            packages/pi-adapter/fixtures/pi-upstream-baseline.json \
            scripts/probes/pi-lifecycle-ci.mjs \
            scripts/probes/pi-compaction-session-replacement-capture.mjs \
            | tar -xf - -C "$BUNDLE"
          if [[ -f packages/pi-adapter/fixtures/pi-lifecycle-compaction-session-replacement.json ]]; then
            tar -cf - packages/pi-adapter/fixtures/pi-lifecycle-compaction-session-replacement.json \
              | tar -xf - -C "$BUNDLE"
          fi
          chmod -R a-w "$BUNDLE"
          chmod 0777 "$RESULT_DIR"

          COMMITTED_ARGS=()
          if [[ -f "$BUNDLE/packages/pi-adapter/fixtures/pi-lifecycle-compaction-session-replacement.json" ]]; then
            COMMITTED_ARGS+=(
              --env PI_LIFECYCLE_COMMITTED_FIXTURE=/probe/packages/pi-adapter/fixtures/pi-lifecycle-compaction-session-replacement.json
            )
          fi

          docker run --rm \
            --network=bridge \
            --read-only \
            --user=1000:1000 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=256 \
            --memory=2g \
            --cpus=2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=1536m,uid=1000,gid=1000,mode=1777 \
            --mount type=bind,src="$BUNDLE",dst=/probe,readonly \
            --mount type=bind,src="$RESULT_DIR",dst=/output \
            --workdir /probe \
            --env HOME=/tmp/home \
            --env CI=true \
            --env GITHUB_ACTIONS=true \
            --env PI_LIFECYCLE_OUTPUT=/output/result.json \
            --env PI_LIFECYCLE_SCENARIO=compaction-session-replacement \
            --env PI_LIFECYCLE_CAPTURE_SCRIPT=/probe/scripts/probes/pi-compaction-session-replacement-capture.mjs \
            --env PI_PROBE_SOURCE_READ_ONLY=true \
            --env PI_PROBE_HOST_WORKSPACE_MOUNTED=false \
            --env PI_PROBE_CONTAINER_ROOT_READ_ONLY=true \
            --env PI_PROBE_CAPABILITIES_DROPPED=true \
            --env PI_PROBE_NO_NEW_PRIVILEGES=true \
            --env PI_PROBE_CONTAINER_IMAGE="$PI_PROBE_IMAGE" \
            "${COMMITTED_ARGS[@]}" \
            "$PI_PROBE_IMAGE" \
            node scripts/probes/pi-lifecycle-ci.mjs

      - name: Validate sanitized Compaction and Session Replacement evidence
        env:
          PI_COMPACTION_SESSION_REPLACEMENT_OUTPUT: ${{ runner.temp }}/zhiwei-pi-compaction-session-replacement-result/result.json
        run: node scripts/check-pi-compaction-session-replacement-result.mjs "$PI_COMPACTION_SESSION_REPLACEMENT_OUTPUT"

      - name: Upload sanitized Compaction and Session Replacement evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pi-compaction-session-replacement-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zhiwei-pi-compaction-session-replacement-result/result.json
          if-no-files-found: error
          retention-days: 3
