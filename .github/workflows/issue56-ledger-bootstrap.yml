name: Issue 56 SQLite Ledger bootstrap

on:
  push:
    branches: [feat/m0-sqlite-observation-ledger-v1]
    paths:
      - .github/workflows/issue56-ledger-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: issue56-sqlite-ledger-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact staged branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/m0-sqlite-observation-ledger-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Verify trigger and base identities
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          EXPECTED_BASE: 843c09569360184592f3d5cecb3b1b165eba6af7
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"

      - name: Setup exact Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1

      - name: Materialize verified Ledger payload
        env:
          EXPECTED_PAYLOAD_SHA256: fa9a54cab0371fb44a9a2b1eadd46741e2c37139188823b1fde6fd9fa655afb7
          EXPECTED_BASE64_BYTES: "30456"
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD_B64="$RUNNER_TEMP/issue56-ledger-payload.b64"
          PAYLOAD_TAR="$RUNNER_TEMP/issue56-ledger-payload.tar.gz"
          EXPECTED_ENTRIES_FILE="$RUNNER_TEMP/issue56-ledger-expected-entries.txt"
          ACTUAL_ENTRIES_FILE="$RUNNER_TEMP/issue56-ledger-actual-entries.txt"

          find .github/issue56-bootstrap -maxdepth 1 -type f -name 'part-*.txt' -print0 \
            | sort -z \
            | xargs -0 cat \
            | tr -d '\r\n' \
            > "$PAYLOAD_B64"
          test "$(wc -c < "$PAYLOAD_B64" | tr -d ' ')" = "$EXPECTED_BASE64_BYTES"
          base64 --decode "$PAYLOAD_B64" > "$PAYLOAD_TAR"
          echo "$EXPECTED_PAYLOAD_SHA256  $PAYLOAD_TAR" | sha256sum --check -

          cat > "$EXPECTED_ENTRIES_FILE" <<'EOF'
          packages/memory-store/
          packages/memory-store/migrations/
          packages/memory-store/migrations/0001_normalized_runtime_event_v1.sql
          packages/memory-store/src/
          packages/memory-store/src/sqlite-observation-ledger.ts
          packages/memory-store/src/index.ts
          packages/memory-store/src/sqlite-observation-ledger.test.ts
          packages/memory-store/src/migrations.ts
          packages/memory-store/AGENTS.md
          docs/architecture/sqlite-observation-ledger-v1.md
          docs/adr/0006-sqlite-observation-ledger-v1.md
          docs/harness/project-state.md
          EOF
          LC_ALL=C sort -o "$EXPECTED_ENTRIES_FILE" "$EXPECTED_ENTRIES_FILE"
          tar -tzf "$PAYLOAD_TAR" | LC_ALL=C sort > "$ACTUAL_ENTRIES_FILE"
          test "$(wc -l < "$ACTUAL_ENTRIES_FILE" | tr -d ' ')" = \
            "$(sort -u "$ACTUAL_ENTRIES_FILE" | wc -l | tr -d ' ')"
          diff -u "$EXPECTED_ENTRIES_FILE" "$ACTUAL_ENTRIES_FILE"

          rm -rf .github/issue56-bootstrap
          rm .github/workflows/issue56-ledger-bootstrap.yml
          tar -xzf "$PAYLOAD_TAR" -C .

          test ! -e .github/issue56-bootstrap
          test ! -e .github/workflows/issue56-ledger-bootstrap.yml
          test -f packages/memory-store/migrations/0001_normalized_runtime_event_v1.sql
          test -f packages/memory-store/src/sqlite-observation-ledger.ts
          test -f packages/memory-store/src/sqlite-observation-ledger.test.ts
          test -f docs/architecture/sqlite-observation-ledger-v1.md
          test -f docs/adr/0006-sqlite-observation-ledger-v1.md

      - name: Validate SQLite Ledger against the real protocol
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.1"
          node -e 'import("node:sqlite").then(({DatabaseSync}) => { const db = new DatabaseSync(":memory:"); db.exec("CREATE TABLE proof(value INTEGER) STRICT"); db.close(); console.log("node:sqlite v22.23.1: OK"); })'
          node --experimental-strip-types --test packages/memory-store/src/sqlite-observation-ledger.test.ts
          npm run check
          git diff --check

      - name: Publish one clean commit from merged main
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          EXPECTED_BASE: 843c09569360184592f3d5cecb3b1b165eba6af7
          TARGET_BRANCH: feat/m0-sqlite-observation-ledger-v1
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git reset --soft "$EXPECTED_BASE"

          EXPECTED_PATHS=$(cat <<'EOF'
          docs/adr/0006-sqlite-observation-ledger-v1.md
          docs/architecture/sqlite-observation-ledger-v1.md
          docs/harness/project-state.md
          packages/memory-store/AGENTS.md
          packages/memory-store/migrations/0001_normalized_runtime_event_v1.sql
          packages/memory-store/src/index.ts
          packages/memory-store/src/migrations.ts
          packages/memory-store/src/sqlite-observation-ledger.test.ts
          packages/memory-store/src/sqlite-observation-ledger.ts
          EOF
          )
          ACTUAL_PATHS="$(git diff --cached --name-only | sort)"
          test "$ACTUAL_PATHS" = "$EXPECTED_PATHS"
          test ! -e .github/issue56-bootstrap
          test ! -e .github/workflows/issue56-ledger-bootstrap.yml

          git config user.name "zhiwei ledger bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat(memory-store): add SQLite Observation Ledger v1"
          git push \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"