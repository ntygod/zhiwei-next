name: AI runtime v1 source export

on:
  push:
    branches:
      - automation/runtime-v1-source-export

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Package source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/zhiwei-next-runtime-v1-source.tgz" .

      - name: Upload short-lived source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zhiwei-next-runtime-v1-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zhiwei-next-runtime-v1-source.tgz
          if-no-files-found: error
          retention-days: 1
