name: AI cleanup Compaction orchestration

on:
  push:
    branches:
      - chore/cleanup-compaction-ai-orchestration
    paths:
      - .github/ai-cleanup-compaction-trigger

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore(harness): trigger Compaction orchestration cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/cleanup-compaction-ai-orchestration
          persist-credentials: true
          fetch-depth: 0

      - name: Remove only temporary Compaction orchestration
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/pi-compaction-session-replacement.yml
          test -f packages/pi-adapter/fixtures/pi-lifecycle-compaction-session-replacement.json
          for path in \
            .github/workflows/ai-source-export.yml \
            .github/workflows/ai-compaction-finalize.yml \
            .github/workflows/ai-compaction-review.yml \
            .github/workflows/ai-cleanup-compaction-orchestration.yml \
            .github/ai-source-export-trigger \
            .github/ai-compaction-finalize-trigger \
            .github/ai-compaction-review-trigger \
            .github/ai-cleanup-compaction-trigger
          do
            if [[ -e "$path" ]]; then
              git rm -f "$path"
            fi
          done
          if [[ -d .github/ai-payload ]]; then
            git rm -rf .github/ai-payload
          fi
          npm run check
          git diff --cached --check
          git diff --cached --name-only | sort > "$RUNNER_TEMP/changed.txt"
          python - "$RUNNER_TEMP/changed.txt" <<'PY'
          from pathlib import Path
          import sys
          paths = Path(sys.argv[1]).read_text().splitlines()
          allowed_files = {
              '.github/workflows/ai-source-export.yml',
              '.github/workflows/ai-compaction-finalize.yml',
              '.github/workflows/ai-compaction-review.yml',
              '.github/workflows/ai-cleanup-compaction-orchestration.yml',
              '.github/ai-source-export-trigger',
              '.github/ai-compaction-finalize-trigger',
              '.github/ai-compaction-review-trigger',
              '.github/ai-cleanup-compaction-trigger',
          }
          unexpected = [p for p in paths if p not in allowed_files and not p.startswith('.github/ai-payload/')]
          if unexpected:
              raise SystemExit(f'Unexpected cleanup paths: {unexpected}')
          required = {
              '.github/workflows/ai-source-export.yml',
              '.github/workflows/ai-compaction-finalize.yml',
              '.github/workflows/ai-compaction-review.yml',
              '.github/workflows/ai-cleanup-compaction-orchestration.yml',
          }
          missing = sorted(required - set(paths))
          if missing:
              raise SystemExit(f'Expected temporary workflows were not present on cleanup base: {missing}')
          PY

      - name: Commit and push cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git commit -m "chore(harness): remove Compaction AI orchestration"
          git push origin HEAD:chore/cleanup-compaction-ai-orchestration
