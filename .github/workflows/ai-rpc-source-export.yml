name: AI apply RPC initial implementation

on:
  push:
    branches:
      - spike/m0-pi-rpc-worker-lifecycle
    paths:
      - .github/ai-rpc-apply-trigger

permissions:
  contents: write

jobs:
  apply-initial-implementation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: spike/m0-pi-rpc-worker-lifecycle
          persist-credentials: true
          fetch-depth: 0

      - name: Apply verified non-workflow payload
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/rpc-initial.tgz"
          cat .github/ai-payload/rpc-initial-*.b64 | base64 --decode > "$PAYLOAD"
          echo "c149679e065a78326bc9c48bf2650d4466fab5d46239ddc7dcf340b059efd3fe  $PAYLOAD" | sha256sum --check --strict

          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          package.json
          scripts/check-pi-rpc-worker-lifecycle-result.mjs
          scripts/probes/pi-rpc-worker-lifecycle-capture.mjs
          EOF
          tar -tzf "$PAYLOAD" > "$RUNNER_TEMP/archive-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/archive-files.txt"
          tar -xzf "$PAYLOAD"

          rm -rf .github/ai-payload
          rm -f .github/ai-rpc-apply-trigger .github/ai-rpc-source-export-trigger

          node --check scripts/probes/pi-rpc-worker-lifecycle-capture.mjs
          node --check scripts/check-pi-rpc-worker-lifecycle-result.mjs
          npm run check
          git diff --check
          git status --short

      - name: Commit initial implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git add \
            package.json \
            scripts/check-pi-rpc-worker-lifecycle-result.mjs \
            scripts/probes/pi-rpc-worker-lifecycle-capture.mjs
          git add -u .github/ai-payload .github/ai-rpc-apply-trigger .github/ai-rpc-source-export-trigger
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "RPC implementation payload produced no changes."
            exit 1
          fi
          git commit -m "spike(m0): add Pi RPC Worker lifecycle capture"
          git push origin HEAD:spike/m0-pi-rpc-worker-lifecycle
