name: Pi SDK and RPC parity contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/pi-sdk-rpc-parity.yml
      - package.json
      - packages/pi-adapter/fixtures/pi-upstream-baseline.json
      - packages/pi-adapter/fixtures/pi-lifecycle-sdk-rpc-parity/**
      - scripts/check-pi-sdk-rpc-parity-result.mjs
      - scripts/pi-sdk-rpc-parity-fixture.mjs
      - scripts/probes/pi-lifecycle-ci.mjs
      - scripts/probes/pi-sdk-rpc-parity-contract.mjs
      - scripts/probes/pi-sdk-rpc-parity-faux-extension.mjs
      - scripts/probes/pi-sdk-rpc-parity-capture.mjs
      - scripts/probes/pi-sdk-rpc-parity-composite-capture.mjs
      - docs/spikes/pi-runtime-contract/README.md
      - docs/spikes/pi-runtime-contract/sdk-rpc-parity-lifecycle.md
      - docs/architecture/pi-integration.md
      - docs/harness/project-state.md
  workflow_dispatch:
  schedule:
    - cron: "53 4 * * 1"

permissions:
  contents: read

concurrency:
  group: pi-sdk-rpc-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pi-sdk-rpc-parity-probe:
    name: Pi SDK and RPC parity lifecycle probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup exact Node.js runtime for host validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1

      - name: Validate committed SDK and RPC parity contract
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/probes/pi-sdk-rpc-parity-contract.mjs
          node --check scripts/probes/pi-sdk-rpc-parity-faux-extension.mjs
          node --check scripts/probes/pi-sdk-rpc-parity-capture.mjs
          node --check scripts/probes/pi-sdk-rpc-parity-composite-capture.mjs
          node --check scripts/check-pi-sdk-rpc-parity-result.mjs
          node --check scripts/pi-sdk-rpc-parity-fixture.mjs
          node scripts/pi-sdk-rpc-parity-fixture.mjs --check

      - name: Capture Pi SDK and RPC parity lifecycle in sandbox
        env:
          PI_PROBE_IMAGE: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/zhiwei-pi-sdk-rpc-parity-bundle"
          RESULT_DIR="$RUNNER_TEMP/zhiwei-pi-sdk-rpc-parity-result"
          mkdir -p "$BUNDLE" "$RESULT_DIR"
          tar -cf - \
            packages/pi-adapter/fixtures/pi-upstream-baseline.json \
            scripts/probes/pi-lifecycle-ci.mjs \
            scripts/probes/pi-sdk-rpc-parity-contract.mjs \
            scripts/probes/pi-sdk-rpc-parity-faux-extension.mjs \
            scripts/probes/pi-sdk-rpc-parity-capture.mjs \
            scripts/probes/pi-sdk-rpc-parity-composite-capture.mjs \
            | tar -xf - -C "$BUNDLE"
          chmod -R a-w "$BUNDLE"
          chmod 0777 "$RESULT_DIR"

          docker run --rm \
            --network=bridge \
            --read-only \
            --user=1000:1000 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=256 \
            --memory=2g \
            --cpus=2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=1536m,uid=1000,gid=1000,mode=1777 \
            --mount type=bind,src="$BUNDLE",dst=/probe,readonly \
            --mount type=bind,src="$RESULT_DIR",dst=/output \
            --workdir /probe \
            --env HOME=/tmp/home \
            --env CI=true \
            --env GITHUB_ACTIONS=true \
            --env PI_LIFECYCLE_OUTPUT=/output/result.json \
            --env PI_LIFECYCLE_SCENARIO=sdk-rpc-parity \
            --env PI_LIFECYCLE_CAPTURE_SCRIPT=/probe/scripts/probes/pi-sdk-rpc-parity-composite-capture.mjs \
            --env PI_PROBE_SOURCE_READ_ONLY=true \
            --env PI_PROBE_HOST_WORKSPACE_MOUNTED=false \
            --env PI_PROBE_CONTAINER_ROOT_READ_ONLY=true \
            --env PI_PROBE_CAPABILITIES_DROPPED=true \
            --env PI_PROBE_NO_NEW_PRIVILEGES=true \
            --env PI_PROBE_CONTAINER_IMAGE="$PI_PROBE_IMAGE" \
            "$PI_PROBE_IMAGE" \
            node scripts/probes/pi-lifecycle-ci.mjs

      - name: Validate sanitized SDK and RPC parity evidence
        env:
          PI_SDK_RPC_PARITY_OUTPUT: ${{ runner.temp }}/zhiwei-pi-sdk-rpc-parity-result/result.json
        run: node scripts/check-pi-sdk-rpc-parity-result.mjs "$PI_SDK_RPC_PARITY_OUTPUT"

      - name: Upload sanitized SDK and RPC parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-sdk-rpc-parity-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zhiwei-pi-sdk-rpc-parity-result/result.json
          if-no-files-found: error
          retention-days: 14
