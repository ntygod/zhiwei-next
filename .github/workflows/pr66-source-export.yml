name: PR 66 provenance documentation reconciliation
run-name: pr66-provenance-docs | pr=${{ github.event.pull_request.number }} | head=${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/pr66-source-export.yml
      - .github/pr66-reconcile.py

permissions:
  contents: write

concurrency:
  group: pr66-provenance-docs-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.pull_request.number == 66 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Reconcile and verify final tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object .github/pr66-reconcile.py)" = 7069f16722d086a988f37b8f2463ca91e77dc5ad
          python .github/pr66-reconcile.py
          rm .github/pr66-reconcile.py
          test ! -e .github/workflows/pr66-source-export.yml
          test ! -e .github/pr66-reconcile.py
          test "$(git hash-object docs/harness/project-state.md)" = 96d450f9a8015fda9eb973984b3e4270b674a65d
          test "$(git hash-object docs/spikes/pi-runtime-contract/README.md)" = a69e7b5567d4b2ba5618fbc92c153045c694fbf9
          test "$(git hash-object docs/spikes/pi-runtime-contract/sdk-rpc-parity-lifecycle.md)" = d7d59c087802928498aa25c16c8a5fcd8efd0c11
          test "$(git hash-object packages/pi-adapter/fixtures/pi-lifecycle-sdk-rpc-parity/rpc-worker-lifecycle.md)" = ce17f32e9a42135bf70f03378aa14429612284a6
          test "$(git hash-object docs/architecture/pi-rpc-worker-lifecycle.md)" = e6cd54fed46d936d0957d4457fc1dcc6565ced6c
          test "$(git hash-object docs/architecture/pi-integration.md)" = 5bb65f19006c3b257245dfe70cdfa66703fb8a0b
          npm run check

      - name: Commit exact reconciled scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'zhiwei provenance reconciler'
          git config user.email 'actions@users.noreply.github.com'
          git add -- docs/harness/project-state.md
          git add -- docs/spikes/pi-runtime-contract/README.md
          git add -- docs/spikes/pi-runtime-contract/sdk-rpc-parity-lifecycle.md
          git add -- packages/pi-adapter/fixtures/pi-lifecycle-sdk-rpc-parity/rpc-worker-lifecycle.md
          git add -- docs/architecture/pi-rpc-worker-lifecycle.md
          git add -- docs/architecture/pi-integration.md
          git add -u -- .github/workflows/pr66-source-export.yml
          git add -u -- .github/pr66-reconcile.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git commit -m 'docs(provenance): reconcile PR 66 Runtime identities'
          git push origin "HEAD:$HEAD_BRANCH"
