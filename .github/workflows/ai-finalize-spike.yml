name: AI finalize cancellation and retry exhaustion spike

on:
  push:
    branches:
      - spike/m0-pi-cancel-retry-exhaustion

permissions:
  contents: write

concurrency:
  group: ai-finalize-pr-25
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout finalization branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: spike/m0-pi-cancel-retry-exhaustion
          fetch-depth: 0
          persist-credentials: true

      - name: Restore reviewed source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ai-payload/part-* > "$RUNNER_TEMP/zhiwei-finalize.b64"
          base64 --decode "$RUNNER_TEMP/zhiwei-finalize.b64" > "$RUNNER_TEMP/zhiwei-finalize.txz"
          echo "6ac8cc5462356203ce01802d8712f245b43c53389484129b70d81f0a23b22046  $RUNNER_TEMP/zhiwei-finalize.txz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/zhiwei-finalize.txz"
          node --check scripts/probes/pi-cancel-retry-exhaustion-capture.mjs
          node --check scripts/check-pi-cancel-retry-exhaustion-result.mjs
          git diff --check

      - name: Run full repository checks
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Commit verified contract and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/ai-payload
          rm -f .github/workflows/ai-finalize-spike.yml
          git add -A
          git diff --cached --check
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git commit -m "feat(spike): freeze cancellation and retry exhaustion contract"
          git push origin HEAD:spike/m0-pi-cancel-retry-exhaustion
