name: Main Provenance

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [main-provenance]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: main-provenance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify main update provenance
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const dispatched = context.eventName === "repository_dispatch";
            const provenancePayload = dispatched ? (context.payload.client_payload ?? {}) : context.payload;
            const before = provenancePayload.before;
            const after = provenancePayload.after;
            const repositoryDefaultBranch = context.payload.repository.default_branch;
            const declaredDefaultBranch = provenancePayload.default_branch;
            const defaultBranch = repositoryDefaultBranch;
            const eventSource = dispatched ? provenancePayload.source : "push";
            const expectedPullNumber = Number.isInteger(provenancePayload.pull_number)
              ? provenancePayload.pull_number
              : Number.parseInt(provenancePayload.pull_number, 10);
            const zeroSha = /^0{40}$/;
            const fullSha = /^[0-9a-f]{40}$/;

            function parseBlock(text, marker) {
              const source = text ?? "";
              const markerIndex = source.lastIndexOf(marker);
              if (markerIndex < 0) return undefined;
              const commentStart = source.lastIndexOf("<!--", markerIndex);
              const commentEnd = source.indexOf("-->", markerIndex + marker.length);
              if (commentStart < 0 || commentEnd < 0 || commentStart > markerIndex) return undefined;
              const result = {};
              for (const rawLine of source.slice(markerIndex + marker.length, commentEnd).split(/\r?\n/)) {
                const line = rawLine.trim();
                const separator = line.indexOf(":");
                if (separator <= 0) continue;
                result[line.slice(0, separator).trim()] = line.slice(separator + 1).trim();
              }
              return result;
            }

            if (dispatched) {
              if (context.payload.action !== "main-provenance" || eventSource !== "autonomous-merge") {
                core.setFailed(`Unsupported repository_dispatch provenance source: action=${context.payload.action}, source=${eventSource}.`);
                return;
              }
              if (!Number.isInteger(expectedPullNumber) || expectedPullNumber <= 0) {
                core.setFailed("Autonomous-merge provenance dispatch is missing a valid pull_number.");
                return;
              }
              if (declaredDefaultBranch !== repositoryDefaultBranch) {
                core.setFailed(
                  `Provenance dispatch default branch ${declaredDefaultBranch ?? "<missing>"} differs from repository default ${repositoryDefaultBranch}.`,
                );
                return;
              }
            }

            if (!fullSha.test(before ?? "") || !fullSha.test(after ?? "") || !defaultBranch || zeroSha.test(after)) {
              core.setFailed("Main branch deletion or malformed provenance payload cannot be authorized.");
              return;
            }
            if (zeroSha.test(before)) {
              core.notice("Initial default-branch creation is outside the provenance guard scope.");
              return;
            }

            let associatedPullRequests = [];
            for (let attempt = 0; attempt < 15; attempt += 1) {
              associatedPullRequests = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner, repo, commit_sha: after, per_page: 100 },
              );
              if (associatedPullRequests.some((pr) =>
                pr.merged_at && pr.merge_commit_sha === after && pr.base?.ref === defaultBranch
              )) break;
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }

            const associatedMergedPullRequest = associatedPullRequests.find((pr) =>
              pr.merged_at && pr.merge_commit_sha === after && pr.base?.ref === defaultBranch
            );
            let authorizationFailure;

            if (associatedMergedPullRequest) {
              if (dispatched && associatedMergedPullRequest.number !== expectedPullNumber) {
                authorizationFailure =
                  `dispatch expected PR #${expectedPullNumber}, but commit is associated with PR #${associatedMergedPullRequest.number}`;
              } else if (associatedMergedPullRequest.base?.sha !== before) {
                authorizationFailure =
                  `merged PR base ${associatedMergedPullRequest.base?.sha ?? "<missing>"} differs from provenance before ${before}`;
              } else {
                const { data: afterCommit } = await github.rest.git.getCommit({
                  owner,
                  repo,
                  commit_sha: after,
                });
                const parents = afterCommit.parents ?? [];
                if (parents.length !== 1 || parents[0].sha !== before) {
                  authorizationFailure =
                    `merge commit parent contract differs from provenance before ${before}`;
                }
              }
            } else {
              authorizationFailure = "no merged pull request is associated with the main update";
            }

            if (!authorizationFailure) {
              core.notice(
                `Authorized main update ${after} from merged PR #${associatedMergedPullRequest.number} via ${eventSource}.`,
              );
              return;
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            let incident = openIssues.find((issue) => {
              const record = parseBlock(issue.body, "zhiwei-main-incident");
              return record?.status === "open" && record?.kind === "unauthorized-main-write";
            });

            const incidentBody = `## 自动检测到未经验证的 main 更新\n\n` +
              `Main Provenance 无法证明默认分支更新来自满足合同的已合并 Pull Request。\n\n` +
              `- before: \`${before}\`\n` +
              `- after: \`${after}\`\n` +
              `- event source: \`${eventSource}\`\n` +
              `- reason: \`${authorizationFailure}\`\n` +
              `- actor: \`${context.actor}\`\n` +
              `- workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\n\n` +
              `仓库已进入安全停机：除标记为 main incident recovery 的 R3 PR 外，自动合并暂停。` +
              `只有真实 push 事件能够提供自动恢复的 before tree；不可信 dispatch 永远不会直接生成恢复提交。\n\n` +
              `<!--\nzhiwei-main-incident\nstatus: open\nkind: unauthorized-main-write\nreason: provenance-validation-failed\nbefore: ${before}\nafter: ${after}\n-->`;

            if (!incident) {
              ({ data: incident } = await github.rest.issues.create({
                owner,
                repo,
                title: `incident(r3): unverified main update ${after.slice(0, 12)}`,
                body: incidentBody,
              }));
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: incident.number,
                body: `检测到新的未验证 main 更新。\n\n- before: \`${before}\`\n- after: \`${after}\`\n- event source: \`${eventSource}\`\n- reason: \`${authorizationFailure}\`\n- actor: \`${context.actor}\`\n- run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              });
            }

            let recoverySummary;
            if (dispatched) {
              recoverySummary = "没有创建自动恢复 PR：repository_dispatch payload 不是可信的 tree 恢复来源。";
            } else {
              const [{ data: beforeCommit }, { data: afterCommit }, { data: currentRef }] = await Promise.all([
                github.rest.git.getCommit({ owner, repo, commit_sha: before }),
                github.rest.git.getCommit({ owner, repo, commit_sha: after }),
                github.rest.git.getRef({ owner, repo, ref: `heads/${defaultBranch}` }),
              ]);
              const currentHead = currentRef.object.sha;
              const beforeTree = beforeCommit.tree.sha;
              const afterTree = afterCommit.tree.sha;

              if (currentHead !== after) {
                recoverySummary = `没有创建自动恢复 PR：main 已从 ${after} 移动到 ${currentHead}，拒绝基于过期状态恢复。`;
              } else if (beforeTree === afterTree) {
                recoverySummary = "没有创建自动恢复 PR：未经授权的提交没有改变 Git tree。";
              } else {
                const branch = `recovery/main-${after}`;
                const existingPullRequests = await github.paginate(github.rest.pulls.list, {
                  owner,
                  repo,
                  state: "all",
                  head: `${owner}:${branch}`,
                  base: defaultBranch,
                  per_page: 100,
                });

                if (existingPullRequests.length > 0) {
                  const existing = existingPullRequests[0];
                  recoverySummary = `已存在恢复 PR #${existing.number}（state=${existing.state}, merged=${Boolean(existing.merged_at)}），不重复创建。`;
                } else {
                  let recoveryCommitSha;
                  try {
                    const { data: existingRef } = await github.rest.git.getRef({
                      owner,
                      repo,
                      ref: `heads/${branch}`,
                    });
                    const { data: existingCommit } = await github.rest.git.getCommit({
                      owner,
                      repo,
                      commit_sha: existingRef.object.sha,
                    });
                    const validParent = existingCommit.parents?.length === 1 && existingCommit.parents[0].sha === after;
                    if (!validParent || existingCommit.tree.sha !== beforeTree) {
                      core.setFailed(`Existing recovery branch ${branch} does not match the expected parent/tree contract.`);
                      return;
                    }
                    recoveryCommitSha = existingRef.object.sha;
                  } catch (error) {
                    if (error.status !== 404) throw error;
                    const { data: recoveryCommit } = await github.rest.git.createCommit({
                      owner,
                      repo,
                      message: `revert: restore main tree before unauthorized update ${after.slice(0, 12)}`,
                      tree: beforeTree,
                      parents: [after],
                    });
                    await github.rest.git.createRef({
                      owner,
                      repo,
                      ref: `refs/heads/${branch}`,
                      sha: recoveryCommit.sha,
                    });
                    recoveryCommitSha = recoveryCommit.sha;
                  }

                  const recoveryBody = `## 目标与结果\n\n` +
                    `恢复未经 PR 更新 \`${after}\` 之前的 Git tree。该 PR 由 Main Provenance workflow 自动创建，保持 Draft，等待 R3 独立 AI 审查。\n\n` +
                    `Addresses #${incident.number}\n\n` +
                    `## 范围与非目标\n\n` +
                    `- 将 main tree 从 \`${afterTree}\` 恢复到 \`${beforeTree}\`；\n` +
                    `- 不重写历史，不直接更新 main；\n` +
                    `- 不关闭主 Incident，风险处置完成前保持安全停机。\n\n` +
                    `## 关键不变量\n\n` +
                    `- 恢复 commit 的 parent 是未经授权提交；\n` +
                    `- 恢复 commit 的 tree 与 before commit 完全一致；\n` +
                    `- 必须经过完整 CI 和当前 HEAD 绑定的 R3 审查。\n\n` +
                    `## 风险与回滚\n\n` +
                    `- 风险：R3；\n` +
                    `- 若 before tree 不是正确恢复目标，关闭本 PR 并从 Incident 证据重新构造；\n` +
                    `- 合并后可以通过新的恢复 PR 回滚，不 force-push。\n\n` +
                    `## 验证证据\n\n` +
                    `- [ ] npm run check\n` +
                    `- [ ] tree 与 before commit 一致\n` +
                    `- [ ] 当前 HEAD 独立 AI 审查\n\n` +
                    `## 自主交付记录\n\n` +
                    `- 来源：Main Provenance workflow run ${context.runId}；\n` +
                    `- Incident：#${incident.number}；\n` +
                    `- 当前保持 Draft，不绕过 R3 门禁。\n\n` +
                    `<!--\nzhiwei-harness\nrisk: R3\nautonomous-merge: yes\nindependent-review: required\ngovernance-change: yes\nproject-state: not-needed\nrollback: provided\nmain-incident-recovery: yes\n-->`;

                  const { data: recoveryPr } = await github.rest.pulls.create({
                    owner,
                    repo,
                    title: `revert(main): recover unauthorized update ${after.slice(0, 12)}`,
                    head: branch,
                    base: defaultBranch,
                    body: recoveryBody,
                    draft: true,
                  });
                  recoverySummary = `已创建 Draft 恢复 PR #${recoveryPr.number}，commit ${recoveryCommitSha}，tree ${afterTree} → ${beforeTree}。`;
                }
              }
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: incident.number,
              body: `${recoverySummary}\n\nMain Provenance workflow 将本次更新标记为失败；风险处置完成前，非恢复 PR 的自动合并保持暂停。`,
            });

            core.setFailed(`Unverified update to ${defaultBranch}: ${after}. Incident #${incident.number}. ${recoverySummary}`);
