name: Main Provenance

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: main-provenance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify main update provenance
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const before = context.payload.before;
            const after = context.payload.after;
            const defaultBranch = context.payload.repository.default_branch;
            const zeroSha = /^0{40}$/;

            function parseBlock(text, marker) {
              const source = text ?? "";
              const markerIndex = source.lastIndexOf(marker);
              if (markerIndex < 0) return undefined;
              const commentStart = source.lastIndexOf("<!--", markerIndex);
              const commentEnd = source.indexOf("-->", markerIndex + marker.length);
              if (commentStart < 0 || commentEnd < 0 || commentStart > markerIndex) return undefined;
              const result = {};
              for (const rawLine of source.slice(markerIndex + marker.length, commentEnd).split(/\r?\n/)) {
                const line = rawLine.trim();
                const separator = line.indexOf(":");
                if (separator <= 0) continue;
                result[line.slice(0, separator).trim()] = line.slice(separator + 1).trim();
              }
              return result;
            }

            if (!before || !after || zeroSha.test(after)) {
              core.setFailed("Main branch deletion or malformed push payload cannot be authorized.");
              return;
            }
            if (zeroSha.test(before)) {
              core.notice("Initial default-branch creation is outside the provenance guard scope.");
              return;
            }

            let associatedPullRequests = [];
            for (let attempt = 0; attempt < 6; attempt += 1) {
              associatedPullRequests = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner, repo, commit_sha: after, per_page: 100 },
              );
              if (associatedPullRequests.some((pr) =>
                pr.merged_at && pr.merge_commit_sha === after && pr.base?.ref === defaultBranch
              )) break;
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }

            const associatedMergedPullRequest = associatedPullRequests.find((pr) =>
              pr.merged_at && pr.merge_commit_sha === after && pr.base?.ref === defaultBranch
            );
            if (associatedMergedPullRequest) {
              core.notice(`Authorized main update ${after} from merged PR #${associatedMergedPullRequest.number}.`);
              return;
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            let incident = openIssues.find((issue) => {
              const record = parseBlock(issue.body, "zhiwei-main-incident");
              return record?.status === "open" && record?.kind === "unauthorized-main-write";
            });

            const incidentBody = `## 自动检测到未经 PR 的 main 更新

` +
              `Main Provenance workflow 检测到默认分支更新没有关联到已合并 Pull Request。\n\n` +
              `- before: \`${before}\`\n` +
              `- after: \`${after}\`\n` +
              `- actor: \`${context.actor}\`\n` +
              `- workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\n\n` +
              `仓库已进入安全停机：除标记为 main incident recovery 的 R3 PR 外，自动合并暂停。` +
              `工作流会在当前 main 仍指向该提交且 tree 确实变化时创建 Draft 恢复 PR；不会直接改写 main。\n\n` +
              `<!--\nzhiwei-main-incident\nstatus: open\nkind: unauthorized-main-write\nbefore: ${before}\nafter: ${after}\n-->`;

            if (!incident) {
              ({ data: incident } = await github.rest.issues.create({
                owner,
                repo,
                title: `incident(r3): unauthorized main update ${after.slice(0, 12)}`,
                body: incidentBody,
              }));
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: incident.number,
                body: `检测到新的未经 PR main 更新。\n\n- before: \`${before}\`\n- after: \`${after}\`\n- actor: \`${context.actor}\`\n- run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              });
            }

            const [{ data: beforeCommit }, { data: afterCommit }, { data: currentRef }] = await Promise.all([
              github.rest.git.getCommit({ owner, repo, commit_sha: before }),
              github.rest.git.getCommit({ owner, repo, commit_sha: after }),
              github.rest.git.getRef({ owner, repo, ref: `heads/${defaultBranch}` }),
            ]);
            const currentHead = currentRef.object.sha;
            const beforeTree = beforeCommit.tree.sha;
            const afterTree = afterCommit.tree.sha;

            let recoverySummary;
            if (currentHead !== after) {
              recoverySummary = `没有创建自动恢复 PR：main 已从 ${after} 移动到 ${currentHead}，拒绝基于过期状态恢复。`;
            } else if (beforeTree === afterTree) {
              recoverySummary = "没有创建自动恢复 PR：未经授权的提交没有改变 Git tree。";
            } else {
              const branch = `recovery/main-${after.slice(0, 12)}-${context.runId}`;
              const { data: recoveryCommit } = await github.rest.git.createCommit({
                owner,
                repo,
                message: `revert: restore main tree before unauthorized update ${after.slice(0, 12)}`,
                tree: beforeTree,
                parents: [after],
              });
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: recoveryCommit.sha,
              });

              const recoveryBody = `## 目标与结果

` +
                `恢复未经 PR 更新 \`${after}\` 之前的 Git tree。该 PR 由 Main Provenance workflow 自动创建，保持 Draft，等待 R3 独立 AI 审查。\n\n` +
                `Addresses #${incident.number}\n\n` +
                `## 范围与非目标\n\n` +
                `- 将 main tree 从 \`${afterTree}\` 恢复到 \`${beforeTree}\`；\n` +
                `- 不重写历史，不直接更新 main；\n` +
                `- 不关闭主 Incident，服务端 Ruleset 确认前保持安全停机。\n\n` +
                `## 关键不变量\n\n` +
                `- 恢复 commit 的 parent 是未经授权提交；\n` +
                `- 恢复 commit 的 tree 与 before commit 完全一致；\n` +
                `- 必须经过完整 CI 和当前 HEAD 绑定的 R3 审查。\n\n` +
                `## 风险与回滚\n\n` +
                `- 风险：R3；\n` +
                `- 若 before tree 不是正确恢复目标，关闭本 PR 并由人工/AI 从 Incident 证据重新构造；\n` +
                `- 合并后可以通过新的恢复 PR 回滚，不 force-push。\n\n` +
                `## 验证证据\n\n` +
                `- [ ] npm run check\n` +
                `- [ ] tree 与 before commit 一致\n` +
                `- [ ] 当前 HEAD 独立 AI 审查\n\n` +
                `## 自主交付记录\n\n` +
                `- 来源：Main Provenance workflow run ${context.runId}；\n` +
                `- Incident：#${incident.number}；\n` +
                `- 当前保持 Draft，不绕过 R3 门禁。\n\n` +
                `<!--\nzhiwei-harness\nrisk: R3\nautonomous-merge: yes\nindependent-review: required\ngovernance-change: yes\nproject-state: not-needed\nrollback: provided\nmain-incident-recovery: yes\n-->`;

              const { data: recoveryPr } = await github.rest.pulls.create({
                owner,
                repo,
                title: `revert(main): recover unauthorized update ${after.slice(0, 12)}`,
                head: branch,
                base: defaultBranch,
                body: recoveryBody,
                draft: true,
              });
              recoverySummary = `已创建 Draft 恢复 PR #${recoveryPr.number}，tree ${afterTree} → ${beforeTree}。`;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: incident.number,
              body: `${recoverySummary}\n\nMain Provenance workflow 将本次 push 标记为失败；服务端 Ruleset 配置前，非恢复 PR 的自动合并保持暂停。`,
            });

            core.setFailed(`Unauthorized direct update to ${defaultBranch}: ${after}. Incident #${incident.number}. ${recoverySummary}`);
