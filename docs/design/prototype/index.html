<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>知微 2.0 · UI 低保真原型</title>
  <style>
    :root{--bg:#f7f7f4;--surface:#fff;--line:#e3e6e2;--text:#1e2421;--muted:#68706b;--brand:#356a58;--soft:#e7f0eb;--amber:#a66b24;--danger:#b54d4d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
    button{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:220px 1fr 310px}.sidebar{border-right:1px solid var(--line);padding:20px 14px;background:#fafaf8}.brand{font-size:19px;font-weight:700;margin:2px 10px 22px}.search{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 10px;color:var(--muted);margin:0 6px 18px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;color:var(--muted);cursor:pointer}.nav button.active{background:var(--soft);color:var(--brand);font-weight:650}.workspaces{margin:22px 10px 8px;color:var(--muted);font-size:12px}.workspace{padding:8px 10px;border-radius:8px}.workspace.current{background:#f1f3f0;color:var(--text)}.local{position:fixed;bottom:20px;left:24px;color:var(--brand);font-size:12px}.main{padding:0 34px 44px;min-width:0}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.status{display:flex;gap:7px}.pill,.chip{border:1px solid var(--line);border-radius:999px;padding:4px 9px;background:var(--surface);font-size:12px;color:var(--muted)}.content{max-width:850px;margin:32px auto}.eyebrow{color:var(--brand);font-size:12px;font-weight:700}.title{font-size:27px;line-height:1.2;margin:7px 0 8px}.subtitle{color:var(--muted);margin-bottom:24px}.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:18px;margin:12px 0}.hero{background:linear-gradient(135deg,#eef5f1,#fff)}.card h3{margin:0 0 8px;font-size:15px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.meta{font-size:12px;color:var(--muted)}.bar{height:7px;background:#edf0ed;border-radius:99px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;width:62%;background:var(--brand)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;cursor:pointer}.btn.primary{background:var(--brand);border-color:var(--brand);color:white}.btn.danger{color:var(--danger);background:#fff5f5}.notice{border-left:3px solid var(--amber);padding-left:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.aside{border-left:1px solid var(--line);background:#fafaf8;padding:74px 20px 30px}.aside h3{font-size:13px;margin:0 0 12px}.aside section{border-bottom:1px solid var(--line);padding:0 0 18px;margin-bottom:18px}.aside ul{padding-left:17px;margin:8px 0;color:var(--muted)}.switcher{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);display:flex;gap:5px;padding:7px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(20,30,25,.08)}.switcher button{width:30px;height:28px;border:0;border-radius:7px;background:transparent;cursor:pointer}.switcher button.active{background:var(--brand);color:#fff}@media(max-width:1050px){.shell{grid-template-columns:190px 1fr}.aside{display:none}}@media(max-width:760px){.shell{display:block}.sidebar{display:none}.main{padding:0 18px 70px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">◉ 知微</div><div class="search">搜索或执行命令　⌘K</div>
      <nav class="nav" id="nav"></nav>
      <div class="workspaces">工作空间</div>
      <div class="workspace current">ZhiWei 2.0</div><div class="workspace">小说项目</div><div class="workspace">个人研究</div>
      <div class="local">● 本地运行正常</div>
    </aside>
    <main class="main"><header class="top"><span id="crumb">今日</span><div class="status"><span class="pill">本地</span><span class="pill">Pi</span><span class="pill">Claude Sonnet</span></div></header><div class="content" id="content"></div></main>
    <aside class="aside" id="aside"></aside>
  </div>
  <div class="switcher" id="switcher"></div>
<script>
const screens=[
{nav:'今日',title:'下午好，树贵',sub:'今天什么值得推进？',body:`<div class="card hero"><div class="eyebrow">当前焦点</div><h3>ZhiWei 2.0 · MemoryClaim 纠正与版本语义</h3><p>上次停在：确定 supersedesId 的方向，但尚未处理作用域继承。</p><div class="actions"><button class="btn">查看上下文</button><button class="btn primary">继续</button></div></div><h3>值得关注</h3><div class="card notice"><div class="row"><b>当前计划出现向量检索，但此前决定第一阶段只使用 FTS5</b><span class="chip">冲突</span></div><p class="meta">依据：2 条项目决定</p><div class="actions"><button class="btn">暂时忽略</button><button class="btn primary">查看冲突</button></div></div><h3>正在运行</h3><div class="grid"><div class="card"><b>检查 provenance 写入</b><div class="bar"><i></i></div><span class="meta">正在运行 · 12/20 轮</span></div><div class="card"><b>整理旧知微事故案例</b><p class="meta">等待确认</p><button class="btn">审阅权限</button></div></div>`,aside:`<section><h3>今日上下文</h3><ul><li>当前 Workspace：ZhiWei 2.0</li><li>当前目标：定义 Claim 版本模型</li></ul></section><section><h3>隐私</h3><p class="meta">2 条项目记忆将发送给当前远程模型。</p></section>`},
{nav:'工作空间',title:'ZhiWei 2.0',sub:'由 Pi 驱动、具备可治理长期记忆和克制主动注意力的个人 Agent',body:`<div class="grid"><div><div class="card hero"><div class="eyebrow">当前目标</div><h3>完成 MemoryClaim 数据模型</h3><div class="bar"><i></i></div><p class="meta">下一步：定义 disputed 语义</p><button class="btn primary">继续</button></div><div class="card"><h3>近期会话</h3><p>MemoryClaim 版本语义 <span class="meta">今天</span></p><p>Observation 证据模型 <span class="meta">昨天</span></p></div></div><div><div class="card"><h3>关键决定</h3><p>· 新仓库，不兼容旧 Schema</p><p>· Pi 只存在于 Adapter 层</p></div><div class="card notice"><h3>值得关注</h3><p>权限模型仍是工具包装层前置。</p><button class="btn primary">处理</button></div></div></div>`,aside:`<section><h3>项目上下文</h3><b>硬约束</b><ul><li>Domain 不依赖 Pi</li><li>不兼容旧数据库</li></ul></section><section><b>当前决定</b><ul><li>SQLite + FTS5 优先</li><li>暂不引入向量检索</li></ul></section>`},
{nav:'会话',title:'MemoryClaim 版本语义',sub:'共同工作文档，而不是聊天气泡堆叠',body:`<p class="meta">你</p><div class="card">设计一下 MemoryClaim 的纠正语义。</div><p class="meta">知微</p><h3>建议将“纠正”设计为创建新版本，而不是原地修改。</h3><p>这样可以保留审计和时间语义，并确保旧内容不再进入检索。</p><div><span class="chip">使用了 3 条记忆</span> <span class="chip">查看依据</span></div><div class="card"><h3>行动记录</h3><p>✓ 阅读现有 domain 类型</p><p>✓ 搜索 correction 相关代码</p><p>○ 准备修改 memory-claim.ts</p></div><div class="card meta">输入消息…… <div class="actions"><button class="btn">委托</button><button class="btn primary">发送</button></div></div>`,aside:`<section><h3>本轮依据</h3><b>强制约束</b><ul><li>Domain 不依赖 Pi</li><li>用户纠正优先</li></ul></section><section><h3>权限</h3><p class="meta">只读当前工作空间；网络未授权。</p></section>`},
{nav:'权限确认',title:'需要你的确认',sub:'权限必须是一份明确契约',body:`<div class="card notice"><h3>“检查 MemoryClaim 写入链路”希望修改当前工作空间</h3><div class="grid"><div><b>资源</b><p>packages/cognition-core/**</p><b>允许操作</b><p>编辑 TypeScript 文件<br>运行项目测试</p></div><div><b>明确禁止</b><p>网络访问<br>Git push<br>工作空间外写入</p><b>有效期</b><p>仅本次委托</p></div></div><div class="actions"><button class="btn danger">拒绝</button><button class="btn">调整范围</button><button class="btn primary">允许本次执行</button></div></div>`,aside:`<section><h3>请求者</h3><p>Pi Worker #05</p></section><section><h3>风险判断</h3><p class="meta">中等：会修改代码，但不允许网络和发布。</p></section>`},
{nav:'学习审阅',title:'本次工作完成',sub:'长期认知变更必须可见',body:`<div class="card hero"><h3>完成 MemoryClaim 版本语义</h3><p>28 个测试通过，产出 2 个代码变更。</p></div><div class="card"><h3>知微想记住</h3><p>☑ MemoryClaim 的纠正通过新版本完成</p><p class="meta">来源：用户确认 + 已提交的数据模型</p><p>☑ supersedesId 指向被替代版本</p><p class="meta">来源：memory-claim.ts</p><p>☐ disputed 状态暂不进入第一版</p><p class="meta">Agent 推断，尚未确认</p><div class="actions"><button class="btn">逐条检查</button><button class="btn primary">确认选中项</button></div></div>`,aside:`<section><h3>任务结果</h3><ul><li>完成：2</li><li>待确认：1</li><li>失败：0</li></ul></section>`},
{nav:'记忆',title:'当前认知',sub:'知微现在相信什么，而不是数据库实体列表',body:`<div class="row"><div><span class="chip">当前认知</span> <span class="chip">时间线</span> <span class="chip">待确认</span></div><button class="btn primary">记住一件事</button></div><div class="card"><div class="row"><h3>Cognition Core 不得依赖 Pi 类型</h3><span class="chip">明确</span></div><p class="meta">当前有效 · 2 条证据 · 最近使用：今天</p><div class="actions"><button class="btn">查看来源</button><button class="btn">纠正</button></div></div><div class="card"><div class="row"><h3>第一阶段使用 SQLite + FTS5，不引入向量检索</h3><span class="chip">明确</span></div><p class="meta">当前有效 · 1 条证据</p><div class="actions"><button class="btn">查看来源</button><button class="btn">纠正</button></div></div>`,aside:`<section><h3>统计</h3><ul><li>当前有效：27</li><li>待确认：3</li><li>存在争议：1</li></ul></section><section><h3>原则</h3><p class="meta">置信度数值默认不面向普通用户展示。</p></section>`},
{nav:'记忆纠正',title:'纠正记忆',sub:'创建新版本，而不是覆盖历史',body:`<div class="card"><b>旧结论</b><p>Cognition Core 使用 TypeScript 单体</p></div><div class="card"><b>新结论</b><p>存储服务使用 Rust 独立进程</p></div><div class="grid"><div class="card"><b>作用范围</b><p>● 当前工作空间<br>○ 全局</p></div><div class="card"><b>处理旧结论</b><p>● 标记为已替代<br>○ 标记为存在争议</p></div></div><div class="actions"><button class="btn">取消</button><button class="btn primary">保存纠正</button></div>`,aside:`<section><h3>保存后</h3><p class="meta">旧结论仍可在时间线查看，但不会继续进入 Agent 上下文。</p></section>`},
{nav:'关注',title:'关注事项',sub:'为什么现在值得处理？',body:`<div class="card notice"><div class="eyebrow">前置事项 · 现在处理可能更合适</div><h3>权限资源作用域尚未确定，但工具包装层已经准备开始实现。</h3><b>为什么现在</b><p>· 当前目标下一步是工具包装层<br>· 权限模型是该模块的前置条件<br>· 上次讨论尚未形成明确决定</p><p class="meta">依据：3 条项目记忆 · 1 个当前目标</p><div class="actions"><button class="btn">忽略</button><button class="btn">稍后</button><button class="btn primary">开始处理</button></div></div>`,aside:`<section><h3>投递等级</h3><p>Inbox</p></section><section><h3>系统边界</h3><p class="meta">这是一条建议，不会自动创建任务或修改文件。</p></section>`},
{nav:'委托草案',title:'创建委托',sub:'将目标变成有边界的执行契约',body:`<div class="card"><b>目标</b><p>定义 ZhiWei 2.0 的资源权限作用域模型</p><b>工作空间</b><p>ZhiWei 2.0</p></div><div class="grid"><div class="card"><b>可访问范围</b><p>☑ docs/product/**<br>☑ packages/policy-engine/**<br>☐ 其他工作空间</p></div><div class="card"><b>允许工具</b><p>☑ 读取文件<br>☑ 搜索<br>☑ 运行测试<br>☐ 网络访问</p></div></div><div class="card"><b>预算</b><p>最大轮次：20　最大时长：30 分钟</p><b>预期产物</b><p>权限领域模型设计文档</p></div><div class="actions"><button class="btn">取消</button><button class="btn primary">开始</button></div>`,aside:`<section><h3>执行方式</h3><p>● 交互式处理<br>○ 后台委托</p></section><section><h3>默认权限</h3><p class="meta">任何范围外副作用都将再次询问。</p></section>`},
{nav:'委托',title:'运行中委托',sub:'全过程可暂停、可解释、可取消',body:`<div class="card hero"><div class="row"><h3>检查所有 MemoryClaim 写入是否携带 provenance</h3><span class="chip">运行中</span></div><div class="bar"><i></i></div><p class="meta">12/20 轮 · 当前：运行 cognition-core 测试</p><div class="actions"><button class="btn">暂停</button><button class="btn danger">取消</button></div></div><div class="grid"><div class="card"><h3>实时活动</h3><p>✓ 审查 17 个写入入口</p><p>✓ 发现 3 个缺失 provenance 的调用点</p><p>○ 运行完整集成测试</p></div><div class="card"><h3>预算与权限</h3><p>轮次：12 / 20</p><p>权限：只读 + 运行测试</p><p>网络：禁止</p></div></div>`,aside:`<section><h3>Worker</h3><p>Pi Worker #05</p></section><section><h3>使用的记忆</h3><ul><li>所有 Claim 必须有证据</li><li>Domain 不依赖 Pi</li></ul></section>`}
];
const nav=document.getElementById('nav'),content=document.getElementById('content'),aside=document.getElementById('aside'),switcher=document.getElementById('switcher'),crumb=document.getElementById('crumb');
function render(i){const s=screens[i];crumb.textContent=s.nav;content.innerHTML=`<div class="eyebrow">${String(i+1).padStart(2,'0')} · ${s.nav}</div><h1 class="title">${s.title}</h1><div class="subtitle">${s.sub}</div>${s.body}`;aside.innerHTML=s.aside;[...nav.children].forEach((b,n)=>b.classList.toggle('active',n===i));[...switcher.children].forEach((b,n)=>b.classList.toggle('active',n===i));location.hash=String(i+1)}
screens.forEach((s,i)=>{const a=document.createElement('button');a.textContent=s.nav;a.onclick=()=>render(i);nav.appendChild(a);const b=document.createElement('button');b.textContent=i+1;b.title=s.nav;b.onclick=()=>render(i);switcher.appendChild(b)});render(Math.max(0,Math.min(9,(Number(location.hash.slice(1))||1)-1)));
</script>
</body></html>
